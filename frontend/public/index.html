<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SageDrive</title>
  <meta name="description" content="Self-hosted browser-based file manager providing unified access to SMB/NAS shares and Google Drive from a single interface." />
  <meta property="og:title" content="SageDrive" />
  <meta property="og:description" content="Self-hosted browser-based file manager providing unified access to SMB/NAS shares and Google Drive from a single interface." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none'%3E%3Crect width='64' height='64' rx='16' fill='%2301696f'/%3E%3Crect x='4' y='4' width='56' height='56' rx='13' stroke='%234f98a3' stroke-opacity='0.35' stroke-width='2'/%3E%3Cpath d='M14 45L25.5 19L32.5 35L39.5 23.5L51 45' stroke='%23ffffff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='49' cy='19' r='4.5' fill='%237fd8e6'/%3E%3C/svg%3E" />
  <link rel="alternate icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root,[data-theme="light"]{
      --color-bg:#f7f6f2;--color-surface:#f9f8f5;--color-surface-2:#fbfbf9;
      --color-surface-offset:#f3f0ec;--color-surface-dynamic:#e6e4df;
      --color-divider:#dcd9d5;--color-border:#d4d1ca;
      --color-text:#28251d;--color-text-muted:#7a7974;--color-text-faint:#bab9b4;
      --color-primary:#01696f;--color-primary-hover:#0c4e54;
      --color-primary-highlight:#cedcd8;
      --color-error:#a12c7b;--color-success:#437a22;
      --color-warning:#964219;
      --radius-sm:.375rem;--radius-md:.5rem;--radius-lg:.75rem;--radius-xl:1rem;
      --radius-full:9999px;
      --shadow-sm:0 1px 2px oklch(0.2 0.01 80/.06);
      --shadow-md:0 4px 12px oklch(0.2 0.01 80/.08);
      --shadow-lg:0 12px 32px oklch(0.2 0.01 80/.12);
      --font-body:'Inter',sans-serif;--font-mono:'JetBrains Mono',monospace;
      --space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;
      --space-5:1.25rem;--space-6:1.5rem;--space-8:2rem;--space-10:2.5rem;
      --space-12:3rem;--space-16:4rem;
      --text-xs:clamp(.75rem,.7rem + .25vw,.875rem);
      --text-sm:clamp(.875rem,.8rem + .35vw,1rem);
      --text-base:clamp(1rem,.95rem + .25vw,1.125rem);
      --text-lg:clamp(1.125rem,1rem + .75vw,1.5rem);
      --text-xl:clamp(1.5rem,1.2rem + 1.25vw,2.25rem);
      --transition-interactive:180ms cubic-bezier(.16,1,.3,1);
      --sidebar-width:240px;
    }
    [data-theme="dark"]{
      --color-bg:#171614;--color-surface:#1c1b19;--color-surface-2:#201f1d;
      --color-surface-offset:#1d1c1a;--color-surface-dynamic:#2d2c2a;
      --color-divider:#262523;--color-border:#393836;
      --color-text:#cdccca;--color-text-muted:#797876;--color-text-faint:#5a5957;
      --color-primary:#4f98a3;--color-primary-hover:#227f8b;
      --color-primary-highlight:#313b3b;
      --color-error:#d163a7;--color-success:#6daa45;--color-warning:#bb653b;
      --shadow-sm:0 1px 2px oklch(0 0 0/.2);
      --shadow-md:0 4px 12px oklch(0 0 0/.3);
      --shadow-lg:0 12px 32px oklch(0 0 0/.4);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
    body{min-height:100dvh;font-family:var(--font-body);font-size:var(--text-base);
         color:var(--color-text);background:var(--color-bg);display:flex;flex-direction:column}
    img,svg{display:block;max-width:100%}
    button{cursor:pointer;background:none;border:none;font:inherit;color:inherit}
    input,select{font:inherit;color:inherit}
    :focus-visible{outline:2px solid var(--color-primary);outline-offset:3px;border-radius:var(--radius-sm)}
    a,button,[role="button"]{transition:color var(--transition-interactive),
      background var(--transition-interactive),border-color var(--transition-interactive),
      box-shadow var(--transition-interactive)}

    /* Layout */
    #app{display:flex;flex:1;height:100dvh;overflow:hidden}
    #login-screen{display:flex;align-items:center;justify-content:center;
                  min-height:100dvh;background:var(--color-bg)}

    /* Sidebar */
    .sidebar{width:var(--sidebar-width);background:var(--color-surface);
             border-right:1px solid var(--color-border);display:flex;
             flex-direction:column;flex-shrink:0;height:100%;overflow-y:auto}
    .sidebar-header{padding:var(--space-5) var(--space-4);
                    border-bottom:1px solid var(--color-divider);display:flex;
                    align-items:center;gap:var(--space-3)}
    .sidebar-header-link{display:flex;align-items:center;gap:var(--space-3);text-decoration:none;color:inherit}
    .sidebar-logo{width:28px;height:28px;color:var(--color-primary)}
    .sidebar-title{font-weight:600;font-size:var(--text-base);letter-spacing:-.01em}
    .sidebar-section{padding:var(--space-4) var(--space-3) var(--space-2);
                     font-size:var(--text-xs);text-transform:uppercase;
                     letter-spacing:.08em;color:var(--color-text-faint);font-weight:500}
    .sidebar-item{display:flex;align-items:center;gap:var(--space-3);
                  padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);
                  margin:0 var(--space-2);font-size:var(--text-sm);
                  color:var(--color-text-muted);cursor:pointer;
                  transition:background var(--transition-interactive),
                    color var(--transition-interactive)}
    .sidebar-item:hover{background:var(--color-surface-offset);color:var(--color-text)}
    .sidebar-item.active{background:var(--color-primary-highlight);
                         color:var(--color-primary);font-weight:500}
    .sidebar-item svg{flex-shrink:0;width:16px;height:16px}
    .sidebar-footer{margin-top:auto;padding:var(--space-4);
                    border-top:1px solid var(--color-divider)}

    /* Main content */
    .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
    .topbar{display:flex;align-items:center;justify-content:space-between;
            padding:0 var(--space-6);height:56px;border-bottom:1px solid var(--color-border);
            background:var(--color-surface);flex-shrink:0}
    .topbar-left{display:flex;align-items:center;gap:var(--space-3)}
    .topbar-right{display:flex;align-items:center;gap:var(--space-2)}
    .breadcrumb{display:flex;align-items:center;gap:var(--space-2);
                font-size:var(--text-sm);color:var(--color-text-muted)}
    .bc-seg{cursor:pointer;color:var(--color-primary)}
    .bc-seg.current{color:var(--color-text);cursor:default}
    .bc-sep{color:var(--color-text-faint)}
    .content-area{flex:1;overflow-y:auto;padding:var(--space-6)}

    /* Components */
    .btn{display:inline-flex;align-items:center;gap:var(--space-2);
         padding:var(--space-2) var(--space-4);border-radius:var(--radius-md);
         font-size:var(--text-sm);font-weight:500;cursor:pointer;
         border:1px solid transparent;transition:all var(--transition-interactive)}
    .btn svg{width:14px;height:14px}
    .btn-primary{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}
    .btn-primary:hover{background:var(--color-primary-hover);border-color:var(--color-primary-hover)}
    .btn-secondary{background:var(--color-surface-offset);color:var(--color-text);
                   border-color:var(--color-border)}
    .btn-secondary:hover{background:var(--color-surface-dynamic)}
    .btn-danger{background:transparent;color:var(--color-error);border-color:var(--color-error)}
    .btn-danger:hover{background:var(--color-error);color:#fff}
    .btn-ghost{background:transparent;color:var(--color-text-muted)}
    .btn-ghost:hover{background:var(--color-surface-offset);color:var(--color-text)}
    .btn-sm{padding:var(--space-1) var(--space-3);font-size:var(--text-xs)}
    .btn-icon{padding:var(--space-2);border-radius:var(--radius-md);
              display:flex;align-items:center;justify-content:center}

    .card{background:var(--color-surface);border:1px solid var(--color-border);
          border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)}
    .card-header{padding:var(--space-4) var(--space-5);
                 border-bottom:1px solid var(--color-divider);
                 display:flex;align-items:center;justify-content:space-between}
    .card-title{font-weight:600;font-size:var(--text-base)}
    .card-body{padding:var(--space-5)}

    .form-group{display:flex;flex-direction:column;gap:var(--space-2)}
    .form-label{font-size:var(--text-sm);font-weight:500;color:var(--color-text-muted)}
    .form-input{padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);
                border:1px solid var(--color-border);background:var(--color-surface-2);
                font-size:var(--text-sm);width:100%;color:var(--color-text);
                transition:border-color var(--transition-interactive),
                  box-shadow var(--transition-interactive)}
    .form-input:focus{border-color:var(--color-primary);
                      box-shadow:0 0 0 3px oklch(from var(--color-primary) l c h/.15);outline:none}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)}

    /* File browser */
    .file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:var(--space-3)}
    .file-list{display:flex;flex-direction:column;gap:0}
    .file-item-grid{background:var(--color-surface);border:1px solid var(--color-border);
                    border-radius:var(--radius-lg);padding:var(--space-4);
                    cursor:pointer;display:flex;flex-direction:column;align-items:center;
                    gap:var(--space-2);text-align:center;position:relative;
                    transition:all var(--transition-interactive)}
    .file-item-grid.selected{border-color:var(--color-primary);
                             background:oklch(from var(--color-primary) l c h/.1)}
    .grid-dl-btn{position:absolute;top:var(--space-2);right:var(--space-2);
                  opacity:0;transition:opacity var(--transition-interactive);
                  background:var(--color-surface);border-radius:var(--radius-sm);padding:2px}
    .grid-select-cb{position:absolute;top:var(--space-2);left:var(--space-2);
                    width:16px;height:16px;accent-color:var(--color-primary);
                    opacity:0;transition:opacity var(--transition-interactive);cursor:pointer}
    .file-item-grid:hover .grid-dl-btn,
    .file-item-grid:hover .grid-select-cb,
    .file-item-grid.selected .grid-select-cb{opacity:1}
    .file-item-grid:hover{background:var(--color-surface-offset);
                          box-shadow:var(--shadow-md);transform:translateY(-1px)}
    .file-item-list{display:flex;align-items:center;gap:var(--space-3);
                    padding:var(--space-2) var(--space-4);min-height:48px;
                    border-bottom:1px solid var(--color-divider);cursor:pointer;
                    transition:background var(--transition-interactive)}
    .file-item-list:hover{background:var(--color-surface-offset)}
    .file-item-list.selected{background:oklch(from var(--color-primary) l c h/.1)}
    .file-item-list:last-child{border-bottom:none}
    .list-select-cb{width:16px;height:16px;accent-color:var(--color-primary);
                    cursor:pointer;flex-shrink:0}
    .file-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;
               border-radius:var(--radius-md);background:var(--color-surface-offset);flex-shrink:0}
    .file-icon-grid{width:48px;height:48px;display:flex;align-items:center;justify-content:center;
                    border-radius:var(--radius-lg);background:var(--color-surface-offset)}
    .file-name{font-size:var(--text-sm);font-weight:500;
               overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
    .file-meta{font-size:var(--text-xs);color:var(--color-text-muted);
               font-variant-numeric:tabular-nums}
    .file-actions{display:flex;gap:var(--space-1);margin-left:auto;opacity:0;
                  transition:opacity var(--transition-interactive)}
    .file-item-list:hover .file-actions{opacity:1}

    /* Batch selection bar */
    .batch-bar{display:flex;align-items:center;justify-content:space-between;
               gap:var(--space-3);padding:var(--space-2) var(--space-4);
               margin-bottom:var(--space-3);background:var(--color-surface);
               border:1px solid var(--color-primary);border-radius:var(--radius-lg);
               box-shadow:var(--shadow-sm);flex-wrap:wrap}
    .batch-bar-left{display:flex;align-items:center;gap:var(--space-3);font-size:var(--text-sm);font-weight:500}
    .batch-count{font-family:var(--font-mono);font-size:var(--text-xs);
                 background:var(--color-primary);color:#fff;padding:2px 8px;
                 border-radius:var(--radius-sm);font-variant-numeric:tabular-nums}
    .batch-bar-actions{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}

    /* Right-click context menu */
    .context-menu{position:fixed;z-index:300;min-width:200px;
                  background:var(--color-surface-2);border:1px solid var(--color-border);
                  border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
                  padding:var(--space-1);display:none;flex-direction:column;
                  animation:ctx-in 120ms cubic-bezier(.16,1,.3,1)}
    @keyframes ctx-in{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
    .ctx-item{display:flex;align-items:center;gap:var(--space-3);
              padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);
              font-size:var(--text-sm);color:var(--color-text);cursor:pointer;
              text-align:left;width:100%}
    .ctx-item svg{width:15px;height:15px;color:var(--color-text-muted);flex-shrink:0}
    .ctx-item:hover{background:var(--color-surface-offset)}
    .ctx-item:hover svg{color:var(--color-text)}
    .ctx-item.danger{color:var(--color-error)}
    .ctx-item.danger svg{color:var(--color-error)}
    .ctx-item.danger:hover{background:oklch(from var(--color-error) l c h/.12)}
    .ctx-divider{height:1px;background:var(--color-divider);margin:var(--space-1) 0}

    /* Media player controls */
    .media-controls-bar{display:flex;align-items:center;justify-content:space-between;
                        gap:var(--space-3);padding:var(--space-2) var(--space-3);
                        background:var(--color-surface-offset);border-radius:var(--radius-md);
                        flex-wrap:wrap}
    .media-nav-group{display:flex;align-items:center;gap:var(--space-2)}
    .media-track-badge{font-family:var(--font-mono);font-size:var(--text-xs);
                       color:var(--color-text-muted);font-variant-numeric:tabular-nums;
                       padding:0 var(--space-1)}
    .speed-group{display:inline-flex;align-items:center;background:var(--color-surface);
                 border:1px solid var(--color-border);border-radius:var(--radius-md);
                 padding:2px;gap:2px}
    .speed-btn{font-family:var(--font-mono);font-size:11px;padding:2px 6px;
               border-radius:calc(var(--radius-sm) - 1px);color:var(--color-text-muted);
               font-variant-numeric:tabular-nums}
    .speed-btn:hover{color:var(--color-text)}
    .speed-btn.active{background:var(--color-primary);color:#fff;font-weight:500}

    .toolbar{display:flex;align-items:center;gap:var(--space-2);
             margin-bottom:var(--space-5);flex-wrap:wrap}
    .view-toggle{display:flex;background:var(--color-surface-offset);
                 border-radius:var(--radius-md);padding:2px;gap:2px}
    .view-btn{padding:var(--space-1) var(--space-2);border-radius:calc(var(--radius-md) - 2px);
              color:var(--color-text-muted);transition:all var(--transition-interactive)}
    .view-btn.active{background:var(--color-surface);color:var(--color-text);
                     box-shadow:var(--shadow-sm)}

    .badge{display:inline-flex;align-items:center;gap:var(--space-1);
           padding:2px var(--space-2);border-radius:var(--radius-full);
           font-size:var(--text-xs);font-weight:500}
    .badge-primary{background:var(--color-primary-highlight);color:var(--color-primary)}
    .badge-success{background:oklch(from var(--color-success) l c h/.15);color:var(--color-success)}
    .badge-error{background:oklch(from var(--color-error) l c h/.15);color:var(--color-error)}

    .modal-backdrop{position:fixed;inset:0;background:oklch(0 0 0/.5);
                    backdrop-filter:blur(4px);z-index:100;display:flex;
                    align-items:center;justify-content:center;padding:var(--space-4)}
    .modal{background:var(--color-surface);border:1px solid var(--color-border);
           border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);
           width:100%;max-width:480px;animation:modal-in .2s ease}
    @keyframes modal-in{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
    .modal-header{padding:var(--space-5) var(--space-6);
                  border-bottom:1px solid var(--color-divider);
                  display:flex;align-items:center;justify-content:space-between}
    .modal-title{font-weight:600;font-size:var(--text-base)}
    .modal-body{padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-4)}
    .modal-footer{padding:var(--space-4) var(--space-6);
                  border-top:1px solid var(--color-divider);
                  display:flex;justify-content:flex-end;gap:var(--space-3)}

    .dropzone{border:2px dashed var(--color-border);border-radius:var(--radius-lg);
              padding:var(--space-10);text-align:center;
              transition:all var(--transition-interactive);color:var(--color-text-muted)}
    .dropzone.drag-over{border-color:var(--color-primary);
                        background:var(--color-primary-highlight);color:var(--color-primary)}

    .toast-container{position:fixed;bottom:var(--space-6);right:var(--space-6);
                     display:flex;flex-direction:column;gap:var(--space-2);z-index:200}
    .toast{background:var(--color-surface-2);border:1px solid var(--color-border);
           border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);
           box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:var(--space-3);
           font-size:var(--text-sm);min-width:260px;max-width:380px;
           animation:toast-in .3s ease}
    @keyframes toast-in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
    .toast.success{border-color:var(--color-success)}
    .toast.error{border-color:var(--color-error)}
    .toast-icon{flex-shrink:0;width:16px;height:16px}
    .toast.success .toast-icon{color:var(--color-success)}
    .toast.error .toast-icon{color:var(--color-error)}

    .progress-track{width:100%;height:6px;background:var(--color-surface-dynamic);
                    border-radius:var(--radius-full);overflow:hidden;position:relative}
    .progress-fill{height:100%;background:var(--color-primary);border-radius:var(--radius-full);
                   transition:width 120ms linear;width:0%}
    .progress-fill.done{background:var(--color-success)}
    .progress-fill.error{background:var(--color-error)}
    .progress-fill.indeterminate{width:40%;position:absolute;left:0;top:0;
                                 animation:progress-slide 1.1s ease-in-out infinite}
    @keyframes progress-slide{0%{left:-40%}100%{left:100%}}
    .dl-toast{flex-direction:column;align-items:stretch;gap:var(--space-2);min-width:300px}
    .dl-toast-top{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2)}
    .dl-toast-title{display:flex;align-items:center;gap:var(--space-2);font-weight:500;
                    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
    .dl-toast-meta{display:flex;align-items:center;justify-content:space-between;
                   font-size:var(--text-xs);color:var(--color-text-muted);font-family:var(--font-mono)}

    .login-card{background:var(--color-surface);border:1px solid var(--color-border);
                border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);
                width:100%;max-width:380px;padding:var(--space-10)}
    .login-logo{display:flex;align-items:center;gap:var(--space-3);
                margin-bottom:var(--space-8)}
    .login-title{font-size:var(--text-xl);font-weight:700;letter-spacing:-.02em}

    .settings-grid{display:grid;gap:var(--space-6)}
    .share-list{display:flex;flex-direction:column;gap:var(--space-3)}
    .share-item{background:var(--color-surface);border:1px solid var(--color-border);
                border-radius:var(--radius-lg);padding:var(--space-4);
                display:flex;align-items:center;gap:var(--space-4)}
    .share-info{flex:1}
    .share-host{font-size:var(--text-xs);color:var(--color-text-muted);
                font-family:var(--font-mono)}

    .spinner{width:20px;height:20px;border:2px solid var(--color-border);
             border-top-color:var(--color-primary);border-radius:50%;
             animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading-state{display:flex;align-items:center;justify-content:center;
                   padding:var(--space-16);color:var(--color-text-muted)}

    .empty-state{display:flex;flex-direction:column;align-items:center;
                 text-align:center;padding:var(--space-16) var(--space-8);
                 color:var(--color-text-muted)}
    .empty-state svg{width:48px;height:48px;margin-bottom:var(--space-4);
                     color:var(--color-text-faint)}
    .empty-state h3{color:var(--color-text);margin-bottom:var(--space-2)}
    .empty-state p{max-width:36ch;margin-bottom:var(--space-6)}

    @media(max-width:768px){
      .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:50;
               transform:translateX(-100%);transition:transform var(--transition-interactive)}
      .sidebar.open{transform:none}
      .main{width:100%}
      .form-row{grid-template-columns:1fr}
      .file-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
    }
  </style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">

          <rect width="28" height="28" rx="7" fill="currentColor" opacity=".12"/>

<script>
const API = '';
let _token = sessionStorage.getItem('sd_token') || null;
let _user  = null;
let _view  = 'welcome';
let _activeDrive = null;
let _path  = '/';
let _folderId = 'root';
let _pathStack = [];
let BREADCRUMBS = [];
let _viewMode  = 'list';
let _shares    = [];
let _gdStatus  = {configured:false, authenticated:false};
let _gdConfig  = {client_id:'', client_secret:'', redirect_uri:''};
let smbProxyCreds = {username:'sagedrive', configured:false};
let _currentFiles = [];
let _selectedItems = new Map();
let _mediaPlaylist = [];
let _mediaIndex = -1;
let _playbackRate = 1;
let _autoPlayNext = true;

async function apiFetch(path, opts={}) {
  const headers = { ...(opts.headers||{}) };
  if (_token) headers['Authorization'] = `Bearer ${_token}`;
  if (opts.json) {
    headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(opts.json);
    delete opts.json;
  }
  const r = await fetch(API + path, {...opts, headers});
  if (r.status === 401) { doLogout(); throw new Error('Unauthorised'); }
  return r;
}

async function apiJSON(path, opts={}) {
  const r = await apiFetch(path, opts);
  if (!r.ok) {
    const err = await r.json().catch(()=>({error:'Request failed'}));
    throw new Error(err.error || 'Request failed');
  }
  return r.json();
}

document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  try {
    const data = await apiJSON('/api/auth/login', {
      method:'POST',
      json:{
        username: document.getElementById('login-user').value,
        password: document.getElementById('login-pass').value,
      }
    });
    _token = data.token;
    sessionStorage.setItem('sd_token', _token);
    await initApp();
  } catch(err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }
});

async function doLogout() {
  try { await apiFetch('/api/auth/logout', {method:'POST'}); } catch(_){}
  _token = null;
  sessionStorage.removeItem('sd_token');
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

async function initApp() {
  try {
    _user = await apiJSON('/api/auth/me');
  } catch(_) { doLogout(); return; }

  document.getElementById('sidebar-user').textContent = _user.username;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';

  await refreshShares();
  await refreshGDStatus();
  renderSidebar();
  setView('welcome');
  lucide.createIcons();
}

function renderSidebar() {
  const el = document.getElementById('sidebar-drives');
  let html = '';

  const gdConnected = _gdStatus.authenticated;
  html += `<div class="sidebar-item ${_activeDrive?.type==='gdrive'?'active':''}"
              onclick="openGDrive()">
    <svg data-lucide="${gdConnected?'hard-drive':'cloud-off'}"></svg>
    Google Drive
    ${gdConnected?'':`<span class="badge badge-error" style="margin-left:auto;font-size:10px">off</span>`}
  </div>`;

  for (const s of _shares) {
    html += `<div class="sidebar-item ${_activeDrive?.id===s.id&&_activeDrive.type==='smb'?'active':''}"
                onclick="openShare('${s.id}','${escHtml(s.name)}')">
      <svg data-lucide="server"></svg>
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(s.name)}</span>
    </div>`;
  }

  if (!_shares.length && !_gdStatus.configured) {
    html += `<div style="padding:var(--space-3);font-size:var(--text-xs);color:var(--color-text-faint)">
      No drives — add one in Settings
    </div>`;
  }

  el.innerHTML = html;
  lucide.createIcons();
}

function setView(v) {
  _view = v;
  document.querySelectorAll('.sidebar-item[data-view]').forEach(el => {
    el.classList.toggle('active', el.dataset.view === v);
  });
  if (v === 'welcome') renderWelcome();
  if (v === 'settings') renderSettings();
}

function renderWelcome() {
  setBreadcrumb([{name:'Home'}]);
  setTopbarActions('');
  document.getElementById('content-area').innerHTML = `
    <div class="empty-state" style="margin-top:var(--space-12)">
      <svg data-lucide="layers" width="64" height="64" style="color:var(--color-primary)"></svg>
      <h2 style="font-size:var(--text-xl);margin-bottom:var(--space-3)">Welcome to SageDrive</h2>
      <p style="color:var(--color-text-muted);max-width:44ch">
        Select a drive from the sidebar to browse files, or head to
        <strong>Settings</strong> to add an SMB share or connect Google Drive.
      </p>
    </div>`;
  lucide.createIcons();
}

function openShare(id, name) {
  _activeDrive = {type:'smb', id, name};
  _path = '/';
  renderSidebar();
  loadSMBFiles();
}

async function loadSMBFiles() {
  setBreadcrumb(smbBreadcrumbs());
  setTopbarActions(fileToolbar('smb'));
  showLoading();
  try {
    const files = await apiJSON(`/api/smb/browse/${_activeDrive.id}?path=${encodeURIComponent(_path)}`);
    renderFileView(files, 'smb');
  } catch(e) { showError(e.message); }
}

function smbBreadcrumbs() {
  const parts = _path.split('/').filter(Boolean);
  const crumbs = [{name: _activeDrive.name, target: '/'}];
  let built = '';
  for (let i = 0; i < parts.length; i++) {
    built += '/' + parts[i];
    crumbs.push({name: parts[i], target: built});
  }
  return crumbs;
}

function openGDrive() {
  if (!_gdStatus.authenticated) {
    toast('Connect Google Drive in Settings first', 'error'); return;
  }
  _activeDrive = {type:'gdrive', id:'root', name:'Google Drive'};
  _folderId = 'root';
  _pathStack = [{id:'root', name:'Google Drive'}];
  renderSidebar();
  loadGDriveFiles();
}

async function loadGDriveFiles() {
  setBreadcrumb(gDriveBreadcrumbs());
  setTopbarActions(fileToolbar('gdrive'));
  showLoading();
  try {
    const files = await apiJSON(`/api/gdrive/files?folder=${_folderId}`);
    renderFileView(files, 'gdrive');
  } catch(e) { showError(e.message); }
}

function gDriveBreadcrumbs() {
  return _pathStack.map((seg, i) => ({
    name: seg.name,
    index: i
  }));
}

function itemKey(f, type) {
  return type === 'smb' ? (f.path || f.name) : f.id;
}

function clearSelection() {
  _selectedItems.clear();
  updateBatchBar();
  document.querySelectorAll('.file-item-list.selected, .file-item-grid.selected').forEach(el => {
    el.classList.remove('selected');
  });
  document.querySelectorAll('.list-select-cb, .grid-select-cb').forEach(cb => {
    cb.checked = false;
  });
}

function toggleSelectItem(fJson, type, ev) {
  if (ev) ev.stopPropagation();
  const f = parseFileArg(fJson);
  const key = itemKey(f, type);
  if (_selectedItems.has(key)) {
    _selectedItems.delete(key);
  } else {
    _selectedItems.set(key, f);
  }
  if (_currentFiles.length) {
    renderFileView(_currentFiles, type, true);
  }
}

function selectAllItems(type) {
  if (_selectedItems.size === _currentFiles.length && _currentFiles.length > 0) {
    _selectedItems.clear();
  } else {
    for (const f of _currentFiles) {
      _selectedItems.set(itemKey(f, type), f);
    }
  }
  renderFileView(_currentFiles, type, true);
}

function updateBatchBar() {
  const bar = document.getElementById('batch-bar-container');
  if (!bar || !_activeDrive) return;
  const count = _selectedItems.size;
  if (count === 0) {
    bar.innerHTML = '';
    return;
  }
  const type = _activeDrive.type;
  const allSelected = count === _currentFiles.length && _currentFiles.length > 0;
  bar.innerHTML = `
    <div class="batch-bar">
      <div class="batch-bar-left">
        <span class="batch-count">${count} selected</span>
        <button class="btn btn-ghost btn-sm" onclick="selectAllItems('${type}')">
          <svg data-lucide="${allSelected ? 'check-square' : 'square'}" width="14" height="14"></svg>
          ${allSelected ? 'Deselect All' : 'Select All'}
        </button>
      </div>
      <div class="batch-bar-actions">
        <button class="btn btn-secondary btn-sm" onclick="downloadSelectedZip('${type}')">
          <svg data-lucide="archive" width="14" height="14"></svg> Download ZIP
        </button>
        <button class="btn btn-secondary btn-sm" onclick="showTransferModal('${type}')">
          <svg data-lucide="folder-input" width="14" height="14"></svg> Copy to Drive…
        </button>
        <button class="btn btn-danger btn-sm" onclick="deleteSelectedItems('${type}')">
          <svg data-lucide="trash-2" width="14" height="14"></svg> Delete Selected
        </button>
        <button class="btn btn-ghost btn-sm" onclick="clearSelection()">
          <svg data-lucide="x" width="14" height="14"></svg> Clear
        </button>
      </div>
    </div>
  `;
  lucide.createIcons();
}

function renderFileView(files, type, keepSelection = false) {
  if (!keepSelection) {
    _selectedItems.clear();
  }
  if (!files.length) {
    _currentFiles = [];
    document.getElementById('content-area').innerHTML = `
      <div class="empty-state">
        <svg data-lucide="folder-open" width="48" height="48"></svg>
        <h3>Empty folder</h3>
        <p>Upload files or folders, or create a new folder to get started.</p>
      </div>`;
    lucide.createIcons(); return;
  }

  files.sort((a,b) => {
    if (a.type===b.type) return a.name.localeCompare(b.name);
    return a.type==='folder' ? -1 : 1;
  });
  _currentFiles = files;

  const ca = document.getElementById('content-area');
  const listHtml = _viewMode === 'grid'
    ? `<div class="file-grid">${files.map(f=>fileCardGrid(f,type)).join('')}</div>`
    : `<div class="card"><div class="file-list">${files.map(f=>fileCardList(f,type)).join('')}</div></div>`;

  ca.innerHTML = `<div id="batch-bar-container"></div>${listHtml}`;
  updateBatchBar();
  lucide.createIcons();
}

function fileIcon(f) {
  if (f.type==='folder') return 'folder';
  const ext = f.name.split('.').pop().toLowerCase();
  const map = {
    pdf:'file-text',mp3:'music',mp4:'video',mov:'video',avi:'video',
    jpg:'image',jpeg:'image',png:'image',gif:'image',webp:'image',svg:'image',
    zip:'archive',tar:'archive',gz:'archive','7z':'archive',rar:'archive',
    doc:'file-text',docx:'file-text',xls:'file-spreadsheet',xlsx:'file-spreadsheet',
    ppt:'presentation',pptx:'presentation',txt:'file-text',md:'file-text',
    js:'code',ts:'code',py:'code',sh:'code',json:'code',html:'code',css:'code',
  };
  return map[ext] || 'file';
}

function fileColorClass(f) {
  if (f.type==='folder') return 'color:var(--color-gold,#d19900)';
  const ext = f.name.split('.').pop().toLowerCase();
  if (['jpg','jpeg','png','gif','webp','svg'].includes(ext)) return 'color:var(--color-blue)';
  if (['mp3','wav','flac'].includes(ext)) return 'color:var(--color-purple)';
  if (['mp4','mov','avi','mkv'].includes(ext)) return 'color:var(--color-error)';
  if (['zip','tar','gz','rar'].includes(ext)) return 'color:var(--color-warning)';
  if (['pdf'].includes(ext)) return 'color:var(--color-notification,#a13544)';
  return 'color:var(--color-text-muted)';
}

function fmtSize(bytes) {
  if (!bytes) return '—';
  if (bytes < 1024) return bytes+'B';
  if (bytes < 1048576) return (bytes/1024).toFixed(1)+'KB';
  if (bytes < 1073741824) return (bytes/1048576).toFixed(1)+'MB';
  return (bytes/1073741824).toFixed(2)+'GB';
}

function fmtDate(ts) {
  if (!ts) return '';
  const d = typeof ts==='number' ? new Date(ts*1000) : new Date(ts);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}

function encodeFileArg(f) {
  return encodeURIComponent(JSON.stringify(f)).replace(/'/g, '%27');
}

function parseFileArg(fJson) {
  if (typeof fJson === 'object' && fJson !== null) return fJson;
  const s = String(fJson || '');
  try {
    return JSON.parse(s.startsWith('%7B') ? decodeURIComponent(s) : s);
  } catch (_) {
    return JSON.parse(decodeURIComponent(s));
  }
}

function fileCardGrid(f, type) {
  const fj = encodeFileArg(f);
  const key = itemKey(f, type);
  const isSel = _selectedItems.has(key);
  return `<div class="file-item-grid ${isSel ? 'selected' : ''}"
               onclick="fileClick('${fj}','${type}',event)"
               oncontextmenu="openContextMenu(event,'${fj}','${type}')">
    <input type="checkbox" class="grid-select-cb" ${isSel ? 'checked' : ''}
           onclick="toggleSelectItem('${fj}','${type}',event)" title="Select item" />
    <div class="file-icon-grid" style="${fileColorClass(f)}">
      <svg data-lucide="${fileIcon(f)}" width="24" height="24"></svg>
    </div>
    <span class="file-name" title="${escHtml(f.name)}">${escHtml(f.name)}</span>
    <span class="file-meta">${f.type==='folder' ? 'Folder' : fmtSize(f.size)}</span>
    <button class="btn btn-ghost btn-icon btn-sm grid-dl-btn"
        onclick="event.stopPropagation();openContextMenu(event,'${fj}','${type}')" title="More actions">
        <svg data-lucide="more-vertical" width="13" height="13"></svg>
    </button>
  </div>`;
}

function fileCardList(f, type) {
  const fj = encodeFileArg(f);
  const key = itemKey(f, type);
  const isSel = _selectedItems.has(key);
  return `<div class="file-item-list ${isSel ? 'selected' : ''}"
               onclick="fileClick('${fj}','${type}',event)"
               oncontextmenu="openContextMenu(event,'${fj}','${type}')">
    <input type="checkbox" class="list-select-cb" ${isSel ? 'checked' : ''}
           onclick="toggleSelectItem('${fj}','${type}',event)" title="Select item" />
    <div class="file-icon" style="${fileColorClass(f)}">
      <svg data-lucide="${fileIcon(f)}" width="18" height="18"></svg>
    </div>
    <span class="file-name" style="max-width:none;flex:1" title="${escHtml(f.name)}">${escHtml(f.name)}</span>
    <span class="file-meta" style="min-width:80px;text-align:right">${f.type==='folder' ? '—' : fmtSize(f.size)}</span>
    <span class="file-meta" style="min-width:100px;text-align:right">${fmtDate(f.modified)}</span>
    <div class="file-actions" onclick="event.stopPropagation()">
      <button class="btn btn-ghost btn-icon btn-sm" onclick="dlFile('${fj}','${type}')" title="${f.type==='folder'?'Download ZIP':'Download'}">
        <svg data-lucide="download" width="14" height="14"></svg></button>
      <button class="btn btn-ghost btn-icon btn-sm" onclick="showRenameModal('${fj}','${type}')" title="Rename">
        <svg data-lucide="edit-3" width="14" height="14"></svg></button>
      <button class="btn btn-ghost btn-icon btn-sm" onclick="showTransferModal('${type}','${fj}')" title="Copy to Drive…">
        <svg data-lucide="copy" width="14" height="14"></svg></button>
      <button class="btn btn-danger btn-icon btn-sm" onclick="rmFile('${fj}','${type}')" title="Delete">
        <svg data-lucide="trash-2" width="14" height="14"></svg></button>
    </div>
  </div>`;
}

function _fileExt(nameOrObj) {
  var name = (typeof nameOrObj === 'object' && nameOrObj !== null) ? nameOrObj.name : nameOrObj;
  var m = String(name || '').toLowerCase().match(/\.([^.]+)$/);
  return m ? m[1] : '';
}
function _fileMime(nameOrObj) {
  if (typeof nameOrObj === 'object' && nameOrObj !== null && nameOrObj.mimeType) {
    return String(nameOrObj.mimeType).toLowerCase();
  }
  return '';
}
function isVideoFile(nameOrObj) {
  var ext = _fileExt(nameOrObj);
  var mime = _fileMime(nameOrObj);
  if (['mp4','webm','ogg','ogv','mov','m4v','mkv','avi','3gp','ts','m2ts','flv','wmv'].indexOf(ext) !== -1) return true;
  return mime.indexOf('video/') === 0;
}
function isAudioFile(nameOrObj) {
  var ext = _fileExt(nameOrObj);
  var mime = _fileMime(nameOrObj);
  if (['mp3','wav','ogg','oga','m4a','aac','flac','opus','weba','wma','aiff','aif','alac','amr','mid','midi'].indexOf(ext) !== -1) return true;
  return mime.indexOf('audio/') === 0;
}
function isImageFile(nameOrObj) {
  var ext = _fileExt(nameOrObj);
  var mime = _fileMime(nameOrObj);
  if (['jpg','jpeg','png','gif','webp','svg','bmp','ico','avif','jfif','apng'].indexOf(ext) !== -1) return true;
  return mime.indexOf('image/') === 0;
}
function isPdfFile(nameOrObj) {
  var ext = _fileExt(nameOrObj);
  var mime = _fileMime(nameOrObj);
  return ext === 'pdf' || mime === 'application/pdf';
}
function isTextFile(nameOrObj) {
  var ext = _fileExt(nameOrObj);
  var mime = _fileMime(nameOrObj);
  if (['txt','md','markdown','json','js','mjs','cjs','ts','tsx','jsx','py','sh','bash','zsh','html','htm','css','scss','xml','yaml','yml','toml','ini','conf','cfg','env','log','csv','sql','dockerfile','gitignore'].indexOf(ext) !== -1) return true;
  return mime.indexOf('text/') === 0 || mime === 'application/json' || mime === 'application/xml';
}
function getMediaMime(nameOrObj) {
  const ext = _fileExt(nameOrObj);
  const map = {
    mp4:'video/mp4', m4v:'video/mp4', mov:'video/mp4',
    webm:'video/webm', mkv:'video/webm', ogv:'video/ogg', avi:'video/mp4',
    mp3:'audio/mpeg', wav:'audio/wav', ogg:'audio/ogg', oga:'audio/ogg',
    opus:'audio/ogg', m4a:'audio/mp4', aac:'audio/aac', flac:'audio/flac',
    weba:'audio/webm', wma:'audio/mpeg', aiff:'audio/aiff', aif:'audio/aiff'
  };
  return map[ext] || (isVideoFile(nameOrObj) ? 'video/mp4' : 'audio/mpeg');
}
function mediaApiUrl(f, type) {
  var t = encodeURIComponent(_token || '');
  if (type === 'smb') {
    return '/api/smb/download/' + _activeDrive.id
      + '?path=' + encodeURIComponent(f.path) + '&token=' + t;
  }
  return '/api/gdrive/download/' + f.id + '?token=' + t;
}

let _activeMediaAbort = null;
let _activeMediaBlobUrl = null;

function cleanupActiveMedia() {
  if (_activeMediaAbort) {
    try { _activeMediaAbort.abort(); } catch(_) {}
    _activeMediaAbort = null;
  }
  const player = document.getElementById('active-media-player');
  if (player) {
    try {
      player.pause();
      player.removeAttribute('src');
      player.load();
    } catch(_) {}
  }
  if (_activeMediaBlobUrl) {
    try { URL.revokeObjectURL(_activeMediaBlobUrl); } catch(_) {}
    _activeMediaBlobUrl = null;
  }
}

async function fallbackStreamMedia(src, f, player, statusWrap, statusText, statusPct, statusFill) {
  cleanupActiveMedia();
  const ctrl = new AbortController();
  _activeMediaAbort = ctrl;
  const ext = _fileExt(f);
  const isVid = isVideoFile(f);
  const needsVidTranscode = isVid && ['mkv', 'avi', 'wmv', 'flv', 'ts', 'm2ts'].includes(ext);
  const needsAudTranscode = !isVid && ['wma', 'aiff', 'aif', 'alac', 'flac'].includes(ext);
  const fetchUrl = needsVidTranscode
    ? (src + '&transcode=1')
    : (needsAudTranscode ? (src + '&transcode=audio') : src);

  statusWrap.style.display = 'flex';
  statusText.textContent = (needsVidTranscode || needsAudTranscode)
    ? 'Transcoding & buffering stream…'
    : 'Buffering media stream…';
  statusPct.textContent = '0%';
  statusFill.classList.remove('indeterminate', 'error', 'done');
  statusFill.style.width = '0%';

  try {
    const r = await apiFetch(fetchUrl, { signal: ctrl.signal });
    if (!r.ok) throw new Error('Stream failed (' + r.status + ')');

    const total = parseInt(r.headers.get('Content-Length') || '0', 10) || f.size || 0;
    if (!total) statusFill.classList.add('indeterminate');

    const reader = r.body.getReader();
    const chunks = [];
    let received = 0;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.byteLength;
      if (total > 0) {
        const pct = Math.min(100, Math.round((received / total) * 100));
        statusFill.style.width = pct + '%';
        statusPct.textContent = `${pct}% (${fmtSize(received)} / ${fmtSize(total)})`;
      } else {
        statusPct.textContent = fmtSize(received);
      }
    }

    const mime = needsVidTranscode
      ? 'video/mp4'
      : (needsAudTranscode ? 'audio/mpeg' : getMediaMime(f));
    const blob = new Blob(chunks, { type: mime });
    _activeMediaBlobUrl = URL.createObjectURL(blob);
    player.onerror = null;
    player.src = _activeMediaBlobUrl;
    player.playbackRate = _playbackRate;
    statusWrap.style.display = 'none';
    player.play().catch(() => {});
  } catch (err) {
    if (err.name === 'AbortError') return;
    statusFill.classList.remove('indeterminate');
    statusFill.classList.add('error');
    statusFill.style.width = '100%';
    statusText.textContent = 'Playback error: ' + err.message;
  }
}

function setPlaybackRate(rate) {
  _playbackRate = rate;
  const player = document.getElementById('active-media-player');
  if (player) player.playbackRate = rate;
  document.querySelectorAll('.speed-btn').forEach(btn => {
    btn.classList.toggle('active', parseFloat(btn.dataset.rate) === rate);
  });
}

function toggleAutoNext(cb) {
  _autoPlayNext = cb.checked;
}

function playMediaAtIndex(idx, type) {
  if (idx < 0 || idx >= _mediaPlaylist.length) return;
  _mediaIndex = idx;
  openMedia(encodeFileArg(_mediaPlaylist[idx]), type);
}

function prevMediaTrack(type) {
  if (_mediaPlaylist.length <= 1) return;
  const nextIdx = (_mediaIndex - 1 + _mediaPlaylist.length) % _mediaPlaylist.length;
  playMediaAtIndex(nextIdx, type);
}

function nextMediaTrack(type) {
  if (_mediaPlaylist.length <= 1) return;
  const nextIdx = (_mediaIndex + 1) % _mediaPlaylist.length;
  playMediaAtIndex(nextIdx, type);
}

    };
    player.oncanplay = () => {

        player.load();
        player.play().catch(() => {});

function fileClick(fJson, type, ev) {
  if (ev && (ev.shiftKey || ev.metaKey || ev.ctrlKey)) {
    toggleSelectItem(fJson, type, ev);
    return;
  }
  const f = parseFileArg(fJson);
  if (f.type !== 'folder') {
    if (isVideoFile(f) || isAudioFile(f)) { openMedia(fJson, type); return; }
    if (isImageFile(f)) { openImageViewer(fJson, type); return; }
    openBrowserPreview(fJson, type);
    return;
  }
  if (type==='smb') {
    _path = f.path || (_path.replace(/\/$/,'') + '/' + f.name);
    loadSMBFiles();
  } else {
    _pathStack.push({id:f.id, name:f.name});
    _folderId = f.id;
    loadGDriveFiles();
  }
}

function dlFile(fJson, type) {
  const f = parseFileArg(fJson);
  if (f.type === 'folder') {
    if (type === 'smb') {
      authedDownload(
        `/api/smb/zip/${_activeDrive.id}`,
        `${f.name}.zip`,
        0,
        { method: 'POST', json: { paths: [f.path || f.name], name: `${f.name}.zip` } }
      );
    } else {
      authedDownload(
        '/api/gdrive/zip',
        `${f.name}.zip`,
        0,
        { method: 'POST', json: { ids: [f.id], name: `${f.name}.zip` } }
      );
    }
    return;
  }
  if (type==='smb') {
    authedDownload(`/api/smb/download/${_activeDrive.id}?path=${encodeURIComponent(f.path)}&dl=1`, f.name, f.size);
  } else {
    authedDownload(`/api/gdrive/download/${f.id}?dl=1`, f.name, f.size);
  }
}

const _activeDownloads = new Map();

function cancelDownload(dlId) {
  const ctrl = _activeDownloads.get(dlId);
  if (ctrl) {
    ctrl.abort();
    _activeDownloads.delete(dlId);
  }
}

async function authedDownload(path, name, knownSize = 0, fetchOpts = {}) {
  const dlId = 'dl_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
  const ctrl = new AbortController();
  _activeDownloads.set(dlId, ctrl);

  const card = document.createElement('div');
  card.className = 'toast dl-toast';
  card.id = dlId;
  card.innerHTML = `
    <div class="dl-toast-top">
      <div class="dl-toast-title">
        <svg data-lucide="download" class="toast-icon" style="color:var(--color-primary)"></svg>
        <span title="${escHtml(name)}">${escHtml(name)}</span>
      </div>
      <button class="btn btn-ghost btn-icon btn-sm" id="${dlId}_cancel" onclick="cancelDownload('${dlId}')" title="Cancel download">
        <svg data-lucide="x" width="14" height="14"></svg>
      </button>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="${dlId}_fill" style="width:0%"></div>
    </div>
    <div class="dl-toast-meta">
      <span id="${dlId}_status">Starting download…</span>
      <span id="${dlId}_pct">0%</span>
    </div>
  `;
  document.getElementById('toasts').appendChild(card);
  lucide.createIcons();

  const fillEl = document.getElementById(`${dlId}_fill`);
  const statusEl = document.getElementById(`${dlId}_status`);
  const pctEl = document.getElementById(`${dlId}_pct`);
  const cancelBtn = document.getElementById(`${dlId}_cancel`);

  try {
    const startTime = performance.now();
    const r = await apiFetch(path, { ...fetchOpts, signal: ctrl.signal });
    if (!r.ok) {
      const err = await r.json().catch(() => ({ error: 'Download failed' }));
      throw new Error(err.error || 'Download failed');
    }

    const totalBytes = parseInt(r.headers.get('Content-Length') || '0', 10) || knownSize || 0;
    let blob;

    if (r.body && r.body.getReader) {
      if (!totalBytes) fillEl.classList.add('indeterminate');
      const reader = r.body.getReader();
      const chunks = [];
      let receivedBytes = 0;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        receivedBytes += value.byteLength;

        const elapsedSec = Math.max(0.05, (performance.now() - startTime) / 1000);
        const speedStr = fmtSize(Math.round(receivedBytes / elapsedSec)) + '/s';

        if (totalBytes > 0) {
          const pct = receivedBytes >= totalBytes ? 100 : Math.min(99, Math.floor((receivedBytes / totalBytes) * 100));
          fillEl.style.width = pct + '%';
          pctEl.textContent = pct + '%';
          statusEl.textContent = `${fmtSize(receivedBytes)} / ${fmtSize(totalBytes)} • ${speedStr}`;
          if (receivedBytes >= totalBytes) {
            try { reader.cancel(); } catch (_) {}
            break;
          }
        } else {
          pctEl.textContent = speedStr;
          statusEl.textContent = `${fmtSize(receivedBytes)} downloaded`;
        }
      }
      blob = new Blob(chunks, { type: 'application/octet-stream' });
    } else {
      fillEl.classList.add('indeterminate');
      statusEl.textContent = 'Downloading…';
      blob = await r.blob();
    }

    _activeDownloads.delete(dlId);
    fillEl.classList.remove('indeterminate');
    fillEl.classList.add('done');
    fillEl.style.width = '100%';
    pctEl.textContent = '100%';
    statusEl.textContent = `Complete • ${fmtSize(blob.size)}`;
    card.classList.add('success');

    const objUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = objUrl;
    a.download = name;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();

    // Provide a direct Save button on the completed card in case browser popup/activation rules suppressed auto-save after a long transfer
    if (cancelBtn) {
      cancelBtn.outerHTML = `<a href="${objUrl}" download="${escHtml(name)}" class="btn btn-primary btn-sm" style="text-decoration:none;padding:2px 8px;font-size:11px" onclick="setTimeout(()=>document.getElementById('${dlId}')?.remove(), 500)">Save</a>`;
    }

    setTimeout(() => {
      try { a.remove(); } catch (_) {}
    }, 2000);
    setTimeout(() => URL.revokeObjectURL(objUrl), 300000);
    setTimeout(() => card.remove(), 6000);
  } catch (e) {
    _activeDownloads.delete(dlId);
    if (e.name === 'AbortError') {
      fillEl.classList.remove('indeterminate');
      fillEl.classList.add('error');
      statusEl.textContent = 'Download cancelled';
      pctEl.textContent = '';
      setTimeout(() => card.remove(), 1500);
      return;
    }
    fillEl.classList.remove('indeterminate');
    fillEl.classList.add('error');
    fillEl.style.width = '100%';
    card.classList.add('error');
    statusEl.textContent = 'Failed: ' + e.message;
    pctEl.textContent = '';
    setTimeout(() => card.remove(), 4000);
  }
}

// ── Right-Click Context Menu ──────────────────────────────────────────────────
function closeContextMenu() {
  const menu = document.getElementById('context-menu');
  if (menu) menu.style.display = 'none';
}
window.addEventListener('click', closeContextMenu);
window.addEventListener('scroll', closeContextMenu, true);
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeContextMenu();
});

function openContextMenu(e, fJson, type) {
  e.preventDefault();
  e.stopPropagation();
  const f = parseFileArg(fJson);
  const key = itemKey(f, type);
  const isSel = _selectedItems.has(key);
  const isMedia = f.type !== 'folder' && (isVideoFile(f) || isAudioFile(f));
  const isImg = f.type !== 'folder' && isImageFile(f);
  const menu = document.getElementById('context-menu');

  let html = '';
  if (f.type === 'folder') {
    html += `<button class="ctx-item" onclick="closeContextMenu();fileClick('${fJson}','${type}')">
      <svg data-lucide="folder-open"></svg> Open Folder
    </button>`;
  } else if (isMedia) {
    html += `<button class="ctx-item" onclick="closeContextMenu();openMedia('${fJson}','${type}')">
      <svg data-lucide="play"></svg> ${isAudioFile(f) ? 'Stream Audio' : 'Stream Video'}
    </button>`;
  } else if (isImg) {
    html += `<button class="ctx-item" onclick="closeContextMenu();openImageViewer('${fJson}','${type}')">
      <svg data-lucide="image"></svg> View Image
    </button>`;
  } else {
    html += `<button class="ctx-item" onclick="closeContextMenu();openBrowserPreview('${fJson}','${type}')">
      <svg data-lucide="eye"></svg> Open in Browser
    </button>`;
  }

  html += `<button class="ctx-item" onclick="closeContextMenu();dlFile('${fJson}','${type}')">
    <svg data-lucide="${f.type === 'folder' ? 'archive' : 'download'}"></svg>
    ${f.type === 'folder' ? 'Download ZIP' : 'Download'}
  </button>`;

  html += `<button class="ctx-item" onclick="closeContextMenu();showRenameModal('${fJson}','${type}')">
    <svg data-lucide="edit-3"></svg> Rename
  </button>`;

  html += `<button class="ctx-item" onclick="closeContextMenu();showTransferModal('${type}','${fJson}')">
    <svg data-lucide="copy"></svg> Copy to Drive…
  </button>`;

  html += `<button class="ctx-item" onclick="closeContextMenu();toggleSelectItem('${fJson}','${type}')">
    <svg data-lucide="${isSel ? 'check-square' : 'square'}"></svg>
    ${isSel ? 'Deselect' : 'Select'}
  </button>`;

  html += `<div class="ctx-divider"></div>`;
  html += `<button class="ctx-item danger" onclick="closeContextMenu();rmFile('${fJson}','${type}')">
    <svg data-lucide="trash-2"></svg> Delete
  </button>`;

  menu.innerHTML = html;
  menu.style.display = 'flex';
  lucide.createIcons();

  const rect = menu.getBoundingClientRect();
  const x = Math.min(e.clientX, window.innerWidth - rect.width - 12);
  const y = Math.min(e.clientY, window.innerHeight - rect.height - 12);
  menu.style.left = Math.max(8, x) + 'px';
  menu.style.top = Math.max(8, y) + 'px';
}

function showRenameModal(fJson, type) {
  const f = parseFileArg(fJson);
  showModal(`
    <div class="modal-header">
      <span class="modal-title">Rename ${f.type === 'folder' ? 'Folder' : 'File'}</span>

      </div>
    </div>

async function doRename(fJson, type) {
  const f = parseFileArg(fJson);
  const newName = (document.getElementById('rename-input')?.value || '').trim();
  if (!newName || newName === f.name) {
    closeModal();
    return;
  }
  try {
    if (type === 'smb') {
      await apiJSON(`/api/smb/rename/${_activeDrive.id}`, {
        method: 'POST',
        json: { path: f.path || (_path.replace(/\/$/, '') + '/' + f.name), new_name: newName }
      });
      closeModal();
      toast(`Renamed to "${newName}"`, 'success');
      loadSMBFiles();
    } else {
      await apiJSON(`/api/gdrive/rename/${f.id}`, {
        method: 'POST',
        json: { name: newName }
      });
      closeModal();
      toast(`Renamed to "${newName}"`, 'success');
      loadGDriveFiles();
    }
  } catch (e) {
    toast('Rename failed: ' + e.message, 'error');
  }
}

// ── Multi-Select Batch Actions (ZIP Download, Delete, Copy Across Drives) ────
function downloadSelectedZip(type) {
  const items = Array.from(_selectedItems.values());
  if (!items.length) return;
  const archiveName = items.length === 1
    ? `${items[0].name}.zip`
    : `${_activeDrive.name.replace(/\s+/g, '_')}_${items.length}_items.zip`;

  if (type === 'smb') {
    const paths = items.map(it => it.path || (_path.replace(/\/$/, '') + '/' + it.name));
    authedDownload(`/api/smb/zip/${_activeDrive.id}`, archiveName, 0, {
      method: 'POST',
      json: { paths, name: archiveName }
    });
  } else {
    const ids = items.map(it => it.id);
    authedDownload('/api/gdrive/zip', archiveName, 0, {
      method: 'POST',
      json: { ids, name: archiveName }
    });
  }
}

async function deleteSelectedItems(type) {
  const items = Array.from(_selectedItems.values());
  if (!items.length) return;
  if (!confirm(`Delete ${items.length} selected item${items.length > 1 ? 's' : ''}?`)) return;
  let deleted = 0;
  for (const f of items) {
    try {
      if (type === 'smb') {
        await apiJSON(`/api/smb/delete/${_activeDrive.id}`, {
          method: 'DELETE',
          json: { path: f.path || f.name, is_dir: f.type === 'folder' }
        });
      } else {
        await apiJSON(`/api/gdrive/delete/${f.id}`, { method: 'DELETE' });
      }
      deleted++;
    } catch (e) {
      toast(`Failed deleting "${f.name}": ${e.message}`, 'error');
    }
  }
  clearSelection();
  if (deleted) toast(`Deleted ${deleted} item${deleted > 1 ? 's' : ''}`, 'success');
  if (type === 'smb') loadSMBFiles(); else loadGDriveFiles();
}

// ── Cross-Drive Transfer Modal ────────────────────────────────────────────────
let _transferItems = [];
let _transferSrcType = '';
let _transferDestDrive = null;
let _transferDestFolder = '/';
let _transferDestStack = [];

async function showTransferModal(srcType, singleItemJson = null) {
  _transferSrcType = srcType;
  _transferItems = singleItemJson
    ? [parseFileArg(singleItemJson)]
    : Array.from(_selectedItems.values());

  if (!_transferItems.length) {
    toast('Select at least one file or folder first', 'error');
    return;
  }

  await refreshShares();
  await refreshGDStatus();

  const destOptions = [];
  if (_gdStatus.authenticated) {
    destOptions.push({ key: 'gdrive:root', type: 'gdrive', id: 'root', name: 'Google Drive' });
  }
  for (const s of _shares) {
    destOptions.push({ key: `smb:${s.id}`, type: 'smb', id: s.id, name: `SMB: ${s.name}` });
  }

  if (!destOptions.length) {
    toast('No destination drives configured', 'error');
    return;
  }

  // Pick a default target drive (prefer the opposite drive type for quick cross-drive copy)
  const preferred = destOptions.find(d => d.type !== srcType || d.id !== _activeDrive.id) || destOptions[0];
  _transferDestDrive = preferred;
  _transferDestFolder = preferred.type === 'smb' ? '/' : 'root';
  _transferDestStack = [{ id: _transferDestFolder, name: preferred.name }];

  const itemSummary = _transferItems.length === 1
    ? `"${_transferItems[0].name}"`
    : `${_transferItems.length} selected items`;

  showModal(`
    <div class="modal-header">
      <span class="modal-title">Copy ${escHtml(itemSummary)}</span>
      <button class="btn btn-ghost btn-icon" onclick="closeModal()">
        <svg data-lucide="x" width="16" height="16"></svg></button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Destination Drive</label>
        <select class="form-input" id="transfer-drive-select" onchange="onTransferDriveChange(this.value)">
          ${destOptions.map(d => `<option value="${escHtml(d.key)}" ${d.key === preferred.key ? 'selected' : ''}>${escHtml(d.name)}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <label class="form-label">Destination Folder</label>
          <span id="transfer-cur-path" style="font-family:var(--font-mono);font-size:var(--text-xs);color:var(--color-primary)">/</span>
        </div>
        <div id="transfer-folder-browser" style="border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface-2);max-height:200px;overflow-y:auto;padding:var(--space-2)">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="transfer-submit-btn" onclick="doTransfer()">
        <svg data-lucide="copy" width="14" height="14"></svg> Copy Here
      </button>
    </div>
  `);
  lucide.createIcons();
  loadTransferFolders();
}

function onTransferDriveChange(val) {
  const [type, id] = val.split(':');
  const label = type === 'gdrive' ? 'Google Drive' : (_shares.find(s => s.id === id)?.name || id);
  _transferDestDrive = { key: val, type, id, name: label };
  _transferDestFolder = type === 'smb' ? '/' : 'root';
  _transferDestStack = [{ id: _transferDestFolder, name: label }];
  loadTransferFolders();
}

async function loadTransferFolders() {
  const box = document.getElementById('transfer-folder-browser');
  const pathLabel = document.getElementById('transfer-cur-path');
  if (!box || !_transferDestDrive) return;

  if (_transferDestDrive.type === 'smb') {
    pathLabel.textContent = _transferDestFolder;
  } else {
    pathLabel.textContent = '/' + _transferDestStack.slice(1).map(s => s.name).join('/');
  }

  box.innerHTML = `<div style="padding:var(--space-4);text-align:center;color:var(--color-text-muted);font-size:var(--text-xs)">Loading folders…</div>`;
  try {
    let items = [];
    if (_transferDestDrive.type === 'smb') {
      items = await apiJSON(`/api/smb/browse/${_transferDestDrive.id}?path=${encodeURIComponent(_transferDestFolder)}`);
    } else {
      items = await apiJSON(`/api/gdrive/files?folder=${encodeURIComponent(_transferDestFolder)}`);
    }
    const folders = items.filter(it => it.type === 'folder');
    let html = '';

    if ((_transferDestDrive.type === 'smb' && _transferDestFolder !== '/') ||
        (_transferDestDrive.type === 'gdrive' && _transferDestStack.length > 1)) {
      html += `<div class="ctx-item" onclick="transferGoUp()">
        <svg data-lucide="corner-left-up"></svg> .. (Parent folder)
      </div>`;
    }

    if (!folders.length && !html) {
      html = `<div style="padding:var(--space-3);text-align:center;color:var(--color-text-faint);font-size:var(--text-xs)">No subfolders (will copy into current folder)</div>`;
    } else {
      for (const fld of folders) {
        const targetId = _transferDestDrive.type === 'smb'
          ? (fld.path || (_transferDestFolder.replace(/\/$/, '') + '/' + fld.name))
          : fld.id;
        html += `<div class="ctx-item" onclick="transferEnterFolder('${escAttr(targetId)}','${escAttr(fld.name)}')">
          <svg data-lucide="folder" style="color:var(--color-gold,#d19900)"></svg>
          <span>${escHtml(fld.name)}</span>
        </div>`;
      }
    }
    box.innerHTML = html;
    lucide.createIcons();
  } catch (e) {
    box.innerHTML = `<div style="padding:var(--space-3);color:var(--color-error);font-size:var(--text-xs)">${escHtml(e.message)}</div>`;
  }
}

function transferEnterFolder(idOrPath, name) {
  _transferDestFolder = idOrPath;
  _transferDestStack.push({ id: idOrPath, name });
  loadTransferFolders();
}

function transferGoUp() {
  if (_transferDestDrive.type === 'smb') {
    const parts = _transferDestFolder.split('/').filter(Boolean);
    parts.pop();
    _transferDestFolder = '/' + parts.join('/');
  } else if (_transferDestStack.length > 1) {
    _transferDestStack.pop();
    _transferDestFolder = _transferDestStack[_transferDestStack.length - 1].id;
  }
  loadTransferFolders();
}

async function doTransfer() {
  const btn = document.getElementById('transfer-submit-btn');
  if (btn) {
    btn.disabled = true;
    btn.textContent = 'Copying…';
  }
  try {
    const res = await apiJSON('/api/transfer', {
      method: 'POST',
      json: {
        src_type: _transferSrcType,
        src_drive: _activeDrive.id,
        dest_type: _transferDestDrive.type,
        dest_drive: _transferDestDrive.id,
        dest_folder: _transferDestFolder,
        items: _transferItems,
      }
    });
    closeModal();
    clearSelection();
    toast(`Copied ${res.copied} item${res.copied > 1 ? 's' : ''} to ${_transferDestDrive.name}`, 'success');
    if (_transferDestDrive.type === _activeDrive.type && _transferDestDrive.id === _activeDrive.id) {
      if (_activeDrive.type === 'smb') loadSMBFiles(); else loadGDriveFiles();
    }
  } catch (e) {
    toast('Transfer failed: ' + e.message, 'error');
    if (btn) {
      btn.disabled = false;
      btn.textContent = 'Copy Here';
    }
  }
}

async function rmFile(fJson, type) {
  const f = parseFileArg(fJson);
  if (!confirm(`Delete "${f.name}"?`)) return;
  try {
    if (type==='smb') {
      await apiJSON(`/api/smb/delete/${_activeDrive.id}`, {
        method:'DELETE', json:{path:f.path||f.name, is_dir:f.type==='folder'}
      });
      loadSMBFiles();
    } else {
      await apiJSON(`/api/gdrive/delete/${f.id}`, {method:'DELETE'});
      loadGDriveFiles();
    }
    toast(`Deleted "${f.name}"`, 'success');
  } catch(e) { toast('Delete failed: '+e.message, 'error'); }
}

async function readEntryRecursively(entry, parentPath = '') {
  if (entry.isFile) {
    return new Promise((resolve) => {
      entry.file((file) => {
        const relPath = parentPath ? `${parentPath}/${file.name}` : file.name;
        resolve([{ file, relativePath: relPath }]);
      }, () => resolve([]));
    });
  }
  if (entry.isDirectory) {
    const dirReader = entry.createReader();
    const allEntries = [];
    while (true) {
      const batch = await new Promise((resolve) => dirReader.readEntries(resolve, () => resolve([])));
      if (!batch || batch.length === 0) break;
      allEntries.push(...batch);
    }
    const nextParent = parentPath ? `${parentPath}/${entry.name}` : entry.name;
    const nested = [];
    for (const child of allEntries) {
      const items = await readEntryRecursively(child, nextParent);
      nested.push(...items);
    }
    return nested;
  }
  return [];
}

async function dzDrop(e, type) {
  e.preventDefault();
  document.getElementById('dropzone')?.classList.remove('drag-over');
  const items = e.dataTransfer?.items;
  if (items && items.length && typeof items[0].webkitGetAsEntry === 'function') {
    const entries = [];
    for (let i = 0; i < items.length; i++) {
      const entry = items[i].webkitGetAsEntry();
      if (entry) entries.push(entry);
    }
    const collected = [];
    for (const entry of entries) {
      const filesWithPaths = await readEntryRecursively(entry, '');
      collected.push(...filesWithPaths);
    }
    if (collected.length) {
      await uploadFileEntries(collected, type);
      return;
    }
  }
  uploadFiles(e.dataTransfer.files, type);
}

function uploadFileWithProgress(url, file, relativePath, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', API + url);
    if (_token) xhr.setRequestHeader('Authorization', `Bearer ${_token}`);
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable && onProgress) onProgress(e.loaded, e.total);
    };
    xhr.onload = () => {
      if (xhr.status === 401) { doLogout(); reject(new Error('Unauthorised')); return; }
      if (xhr.status >= 200 && xhr.status < 300) resolve();
      else reject(new Error('Upload failed'));
    };
    xhr.onerror = () => reject(new Error('Network error'));
    const fd = new FormData();
    if (relativePath) fd.append('relative_path', relativePath);
    fd.append('file', file);
    xhr.send(fd);
  });
}

async function uploadFiles(fileList, type) {
  const entries = Array.from(fileList).map(file => ({
    file,
    relativePath: file.webkitRelativePath || file.name
  }));
  await uploadFileEntries(entries, type);
}

async function uploadFileEntries(entries, type) {
  if (!entries.length) return;
  const prog = document.getElementById('upload-progress');
  const statusText = document.getElementById('upload-status-text');
  const statusPct = document.getElementById('upload-status-pct');
  const fillEl = document.getElementById('upload-progress-fill');
  if (prog) prog.style.display = 'flex';
  let ok = 0;
  for (let i = 0; i < entries.length; i++) {
    const { file, relativePath } = entries[i];
    const displayLabel = relativePath || file.name;
    if (statusText) statusText.textContent = `Uploading (${i + 1}/${entries.length}): ${displayLabel}`;
    if (statusPct) statusPct.textContent = '0%';
    if (fillEl) fillEl.style.width = '0%';
    try {
      const targetUrl = type === 'smb'
        ? `/api/smb/upload/${_activeDrive.id}?path=${encodeURIComponent(_path)}`
        : `/api/gdrive/upload?folder=${encodeURIComponent(_folderId)}`;
      await uploadFileWithProgress(targetUrl, file, relativePath, (loaded, total) => {
        const pct = Math.min(100, Math.round((loaded / total) * 100));
        if (fillEl) fillEl.style.width = pct + '%';
        if (statusPct) statusPct.textContent = `${pct}% (${fmtSize(loaded)} / ${fmtSize(total)})`;
      });
      ok++;
    } catch(e) { toast(`Failed: ${displayLabel} – ${e.message}`, 'error'); }
  }
  closeModal();
  if (ok) toast(`Uploaded ${ok} file${ok>1?'s':''}`, 'success');
  if (type==='smb') loadSMBFiles(); else loadGDriveFiles();
}

async function doMkdir(type) {
  const name = document.getElementById('mkdir-name').value.trim();
  if (!name) return;
  try {
    if (type==='smb') {
      const path = _path.replace(/\/$/,'') + '/' + name;
      await apiJSON(`/api/smb/mkdir/${_activeDrive.id}`, {method:'POST', json:{path}});
      loadSMBFiles();
    } else {
      await apiJSON('/api/gdrive/mkdir', {method:'POST', json:{parent:_folderId, name}});
      loadGDriveFiles();
    }
    closeModal();
    toast('Folder created', 'success');
  } catch(e) { toast('Failed: '+e.message, 'error'); }
}

async function refreshShares() {
  try { _shares = await apiJSON('/api/smb/shares'); } catch(_) { _shares=[]; }
}

async function refreshGDStatus() {
  try { _gdStatus = await apiJSON('/api/gdrive/status'); } catch(_) {}
  try { _gdConfig = await apiJSON('/api/gdrive/config'); } catch(_) {}
}

function showAddShareModal() {
  showModal(`
    <div class="modal-header">
      <span class="modal-title">Add SMB Share</span>
      <button class="btn btn-ghost btn-icon" onclick="closeModal()">
        <svg data-lucide="x" width="16" height="16"></svg></button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Display Name</label>
        <input class="form-input" id="s-name" placeholder="My NAS" /></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Host / IP</label>
          <input class="form-input" id="s-host" placeholder="192.168.1.10" /></div>
        <div class="form-group"><label class="form-label">Share Name</label>
          <input class="form-input" id="s-share" placeholder="media" /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Username</label>
          <input class="form-input" id="s-user" placeholder="smb user" /></div>
        <div class="form-group"><label class="form-label">Password</label>
          <input class="form-input" id="s-pass" type="password" /></div>
      </div>
      <div class="form-group"><label class="form-label">Port (optional)</label>
        <input class="form-input" id="s-port" value="445" type="number" /></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="doAddShare()">Add Share</button>
    </div>
  `);
  lucide.createIcons();
}

async function doAddShare() {
  const body = {
    name: document.getElementById('s-name').value.trim(),
    host: document.getElementById('s-host').value.trim(),
    share: document.getElementById('s-share').value.trim(),
    username: document.getElementById('s-user').value.trim(),
    password: document.getElementById('s-pass').value,
    port: parseInt(document.getElementById('s-port').value)||445,
  };
  if (!body.name||!body.host||!body.share) {
    toast('Name, host and share are required', 'error'); return;
  }
  try {
    await apiJSON('/api/smb/shares', {method:'POST', json:body});
    closeModal();
    toast('Share added', 'success');
    await refreshShares();
    renderSidebar();
    renderSettings();
  } catch(e) { toast('Failed: '+e.message, 'error'); }
}

async function deleteShare(id) {
  if (!confirm('Remove this share?')) return;
  try {
    await apiJSON(`/api/smb/shares/${id}`, {method:'DELETE'});
    toast('Share removed', 'success');
    if (_activeDrive?.id===id) { _activeDrive=null; setView('welcome'); }
    await refreshShares();
    renderSidebar();
    renderSettings();
  } catch(e) { toast('Failed: '+e.message, 'error'); }
}

async function saveGDConfig() {
  try {
    const body = {
      client_id: document.getElementById('gdcid').value.trim(),
      client_secret: document.getElementById('gdsecret').value.trim(),
      redirect_uri: document.getElementById('gdredir').value.trim(),
    };
    await apiJSON('/api/gdrive/config', {method:'POST', json:body});
    toast('Google Drive config saved');
    await refreshGDStatus();
    renderSettings();
  } catch(e) { toast('Save failed: ' + e.message, 'error'); }
}

async function saveSmbProxyCreds() {
  const user = document.getElementById('smb-proxy-user').value.trim();
  const pass = document.getElementById('smb-proxy-pass').value;
  const msg  = document.getElementById('smb-proxy-msg');
  if (!pass) { msg.style.color='var(--color-error)'; msg.textContent='Password is required'; return; }
  try {
    const r = await apiJSON('/api/smb/proxy-credentials', {method:'POST', json:{username:user, password:pass}});
    msg.style.color = 'var(--color-success)';
    msg.textContent = r.message || 'Saved!';
    document.getElementById('smb-proxy-pass').value = '';
    setTimeout(() => renderSettings(), 1500);
  } catch(e) {
    msg.style.color = 'var(--color-error)';
    msg.textContent = 'Failed: ' + e.message;
  }
}

async function connectGDrive() {
  try {
    const data = await apiJSON('/api/gdrive/auth');
    window.open(data.url, '_blank');
    toast('Complete auth in the new tab, then refresh Settings', 'success');
  } catch(e) { toast('Failed: '+e.message, 'error'); }
}

async function disconnectGDrive() {
  if (!confirm('Disconnect Google Drive?')) return;
  try {
    await apiJSON('/api/gdrive/revoke', {method:'DELETE'});
    toast('Google Drive disconnected', 'success');
    if (_activeDrive?.type==='gdrive') { _activeDrive=null; setView('welcome'); }
    await refreshGDStatus();
    renderSidebar();
    renderSettings();
  } catch(e) { toast('Failed: '+e.message, 'error'); }
}

function showLoading() {
  document.getElementById('content-area').innerHTML =
    `<div class="loading-state"><div class="spinner"></div></div>`;
}
function showError(msg) {
  document.getElementById('content-area').innerHTML =
    `<div class="empty-state"><svg data-lucide="alert-triangle" width="48" height="48"></svg>
     <h3>Error</h3><p>${escHtml(msg)}</p></div>`;
  lucide.createIcons();
}

function setBreadcrumb(crumbs) {
  BREADCRUMBS = crumbs;
  const el = document.getElementById('breadcrumb');
  el.innerHTML = crumbs.map((c,i) => {
    const isLast = i===crumbs.length-1;
    const sep = i>0 ? `<span class="bc-sep">/</span>` : '';
    const fn = isLast ? '' : `onclick="bcGo(${i})"`;
    return `${sep}<span class="bc-seg ${isLast?'current':''}" ${fn}>${escHtml(c.name)}</span>`;
  }).join('');
}

function bcGo(i) {
  const c = BREADCRUMBS[i];
  if (!c) return;
  if (_activeDrive?.type === 'smb') {
    _path = c.target;
    loadSMBFiles();
  } else if (_activeDrive?.type === 'gdrive') {
    _pathStack = _pathStack.slice(0, c.index + 1);
    _folderId = c.id || (c.name==='Google Drive'?'root':_pathStack[_pathStack.length-1].id);
    loadGDriveFiles();
  }
}

function setTopbarActions(html) {
  document.getElementById('topbar-actions').innerHTML = html;
  lucide.createIcons();
}
function showModal(html, extraStyle) {
  var st = extraStyle ? 'style="' + extraStyle + '"' : '';
  document.getElementById('modal-root').innerHTML =
    `<div class="modal-backdrop" id="modal-backdrop">
       <div class="modal" ${st}>${html}</div></div>`;
  document.getElementById('modal-backdrop').onclick = e => { if(e.target.id==='modal-backdrop') closeModal(); };
  lucide.createIcons();
}
function closeModal() {
  cleanupActiveMedia();
  document.getElementById('modal-root').innerHTML='';
}
function toast(msg, type='success') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const icon = type==='success' ? 'check-circle' : 'alert-circle';
  el.innerHTML = `<svg data-lucide="${icon}" class="toast-icon"></svg><span>${escHtml(msg)}</span>`;
  document.getElementById('toasts').appendChild(el);
  lucide.createIcons();
  setTimeout(() => el.remove(), 4000);
}
function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) { return escHtml(s); }
function toggleTheme() {
  const html = document.documentElement;
  const t = html.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', t);
}

function checkMobile() {
  const btn = document.getElementById('mobile-menu-btn');
  if (btn) btn.style.display = window.innerWidth < 769 ? 'flex' : 'none';
}
window.addEventListener('resize', checkMobile);

if (location.hash === '#gdrive-connected') {
  history.replaceState(null,'',location.pathname);
}

(async () => {
  if (_token) {
    try { await initApp(); }
    catch(_) {
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('app').style.display = 'none';
    }
  }
  checkMobile();
})();
</script>
