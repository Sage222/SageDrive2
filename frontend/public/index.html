<!DOCTYPE html>
<html lang="en" data-theme="obsidian">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SageDrive</title>
  <meta name="description" content="Self-hosted browser-based file manager providing unified access to SMB/NAS shares, Google Drive, and Microsoft OneDrive from a single interface." />
  <meta property="og:title" content="SageDrive" />
  <meta property="og:description" content="Self-hosted browser-based file manager providing unified access to SMB/NAS shares, Google Drive, and Microsoft OneDrive from a single interface." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none'%3E%3Crect width='64' height='64' rx='16' fill='%2301696f'/%3E%3Crect x='4' y='4' width='56' height='56' rx='13' stroke='%234f98a3' stroke-opacity='0.35' stroke-width='2'/%3E%3Cpath d='M14 45L25.5 19L32.5 35L39.5 23.5L51 45' stroke='%23ffffff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='49' cy='19' r='4.5' fill='%237fd8e6'/%3E%3C/svg%3E" />
  <link rel="alternate icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root,[data-theme="obsidian"],[data-theme="dark"]{
      --color-bg:#111315;--color-surface:#171a1d;--color-surface-2:#1c2024;
      --color-surface-offset:#1f2429;--color-surface-dynamic:#293036;
      --color-divider:#24292e;--color-border:#30373e;
      --color-text:#e6edf3;--color-text-muted:#8b949e;--color-text-faint:#626b75;
      --color-primary:#2dd4bf;--color-primary-hover:#14b8a6;
      --color-primary-highlight:rgba(45,212,191,.13);
      --color-error:#f472b6;--color-success:#4ade80;--color-warning:#fb923c;
      --radius-sm:.375rem;--radius-md:.5rem;--radius-lg:.75rem;--radius-xl:1rem;
      --radius-full:9999px;
      --shadow-sm:0 1px 2px rgba(0,0,0,.3);
      --shadow-md:0 4px 14px rgba(0,0,0,.4);
      --shadow-lg:0 14px 36px rgba(0,0,0,.55);
      --font-body:'Plus Jakarta Sans',sans-serif;--font-mono:'JetBrains Mono',monospace;
      --space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;
      --space-5:1.25rem;--space-6:1.5rem;--space-8:2rem;--space-10:2.5rem;
      --space-12:3rem;--space-16:4rem;
      --text-xs:clamp(.75rem,.7rem + .25vw,.875rem);
      --text-sm:clamp(.875rem,.8rem + .35vw,1rem);
      --text-base:clamp(1rem,.95rem + .25vw,1.125rem);
      --text-lg:clamp(1.125rem,1rem + .75vw,1.5rem);
      --text-xl:clamp(1.5rem,1.2rem + 1.25vw,2.25rem);
      --transition-interactive:180ms cubic-bezier(.16,1,.3,1);
      --sidebar-width:240px;
    }
    [data-theme="midnight"]{
      --color-bg:#0b1120;--color-surface:#111827;--color-surface-2:#162033;
      --color-surface-offset:#1e293b;--color-surface-dynamic:#283548;
      --color-divider:#1e293b;--color-border:#334155;
      --color-text:#f1f5f9;--color-text-muted:#94a3b8;--color-text-faint:#64748b;
      --color-primary:#38bdf8;--color-primary-hover:#0ea5e9;
      --color-primary-highlight:rgba(56,189,248,.14);
      --color-error:#fb7185;--color-success:#34d399;--color-warning:#fbbf24;
    }
    [data-theme="amethyst"]{
      --color-bg:#0e0c16;--color-surface:#151221;--color-surface-2:#1b172b;
      --color-surface-offset:#211c35;--color-surface-dynamic:#2c2545;
      --color-divider:#231e38;--color-border:#352e52;
      --color-text:#ede9fe;--color-text-muted:#a59ec4;--color-text-faint:#716994;
      --color-primary:#a78bfa;--color-primary-hover:#8b5cf6;
      --color-primary-highlight:rgba(167,139,250,.15);
      --color-error:#f472b6;--color-success:#34d399;--color-warning:#fbbf24;
    }
    [data-theme="emerald"]{
      --color-bg:#0a120e;--color-surface:#101b16;--color-surface-2:#15231c;
      --color-surface-offset:#1a2c23;--color-surface-dynamic:#233a2f;
      --color-divider:#1c2e25;--color-border:#2b4437;
      --color-text:#ecfdf5;--color-text-muted:#86a897;--color-text-faint:#597a6a;
      --color-primary:#34d399;--color-primary-hover:#10b981;
      --color-primary-highlight:rgba(52,211,153,.14);
      --color-error:#fb7185;--color-success:#4ade80;--color-warning:#fbbf24;
    }
    [data-theme="ember"]{
      --color-bg:#141011;--color-surface:#1c1618;--color-surface-2:#231b1e;
      --color-surface-offset:#2a2024;--color-surface-dynamic:#36292e;
      --color-divider:#292023;--color-border:#3f3035;
      --color-text:#f5ebed;--color-text-muted:#a89499;--color-text-faint:#756368;
      --color-primary:#fb7185;--color-primary-hover:#f43f5e;
      --color-primary-highlight:rgba(251,113,133,.14);
      --color-error:#f87171;--color-success:#4ade80;--color-warning:#fbbf24;
    }
    .theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--space-4)}
    .theme-card{background:var(--color-surface-2);border:1px solid var(--color-border);
                border-radius:var(--radius-lg);padding:var(--space-4);cursor:pointer;
                display:flex;flex-direction:column;gap:var(--space-3);text-align:left;
                transition:border-color var(--transition-interactive),transform var(--transition-interactive),box-shadow var(--transition-interactive)}
    .theme-card:hover{border-color:var(--color-primary);transform:translateY(-1px);box-shadow:var(--shadow-md)}
    .theme-card.active{border-color:var(--color-primary);box-shadow:0 0 0 1px var(--color-primary)}
    .theme-preview{height:92px;border-radius:var(--radius-md);overflow:hidden;
                   border:1px solid rgba(255,255,255,.08);display:flex;position:relative}
    .theme-preview-sidebar{width:30%;height:100%;padding:8px;display:flex;flex-direction:column;gap:5px;border-right:1px solid rgba(255,255,255,.07)}
    .theme-preview-main{flex:1;height:100%;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
    .theme-swatch-row{display:flex;align-items:center;gap:6px}
    .theme-swatch-dot{width:14px;height:14px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,.14)}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
    body{min-height:100dvh;font-family:var(--font-body);font-size:var(--text-base);
         color:var(--color-text);background:var(--color-bg);display:flex;flex-direction:column}
    img,svg{display:block;max-width:100%}
    button{cursor:pointer;background:none;border:none;font:inherit;color:inherit}
    input,select{font:inherit;color:inherit}
    :focus-visible{outline:2px solid var(--color-primary);outline-offset:3px;border-radius:var(--radius-sm)}
    a,button,[role="button"]{transition:color var(--transition-interactive),
      background var(--transition-interactive),border-color var(--transition-interactive),
      box-shadow var(--transition-interactive)}

    /* Layout */
    #app{display:flex;flex:1;height:100dvh;overflow:hidden;position:relative}
    #login-screen{display:flex;align-items:center;justify-content:center;
                  min-height:100dvh;padding:var(--space-4);background:var(--color-bg)}

    /* Sidebar & Collapsible Menu */
    .sidebar{width:var(--sidebar-width);background:var(--color-surface);
             border-right:1px solid var(--color-border);display:flex;
             flex-direction:column;flex-shrink:0;height:100%;overflow-y:auto;
             transition:margin-left 220ms cubic-bezier(.16,1,.3,1),
                        transform 220ms cubic-bezier(.16,1,.3,1)}
    .sidebar.collapsed{margin-left:calc(-1 * var(--sidebar-width))}
    .sidebar-backdrop{display:none;position:fixed;inset:0;background:oklch(0 0 0/.45);
                      backdrop-filter:blur(2px);z-index:55;opacity:0;
                      transition:opacity 200ms ease}
    .sidebar-backdrop.visible{display:block;opacity:1}
    .sidebar-header{padding:var(--space-4);
                    border-bottom:1px solid var(--color-divider);display:flex;
                    align-items:center;justify-content:space-between;gap:var(--space-2)}
    .sidebar-header-link{display:flex;align-items:center;gap:var(--space-3);text-decoration:none;color:inherit;min-width:0}
    .sidebar-logo{width:28px;height:28px;color:var(--color-primary);flex-shrink:0}
    .sidebar-title{font-weight:600;font-size:var(--text-base);letter-spacing:-.01em;white-space:nowrap}
    .sidebar-section{padding:var(--space-4) var(--space-3) var(--space-2);
                     font-size:var(--text-xs);text-transform:uppercase;
                     letter-spacing:.08em;color:var(--color-text-faint);font-weight:500;
                     display:flex;align-items:center;justify-content:space-between}
    .sidebar-section-btn{width:20px;height:20px;border-radius:var(--radius-sm);
                         display:inline-flex;align-items:center;justify-content:center;
                         color:var(--color-text-muted);cursor:pointer}
    .sidebar-section-btn:hover{background:var(--color-surface-offset);color:var(--color-primary)}
    .sidebar-item{display:flex;align-items:center;gap:var(--space-3);
                  padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);
                  margin:2px var(--space-2);font-size:var(--text-sm);min-height:40px;
                  color:var(--color-text-muted);cursor:pointer;position:relative;
                  transition:background var(--transition-interactive),
                    color var(--transition-interactive)}
    .sidebar-item:hover{background:var(--color-surface-offset);color:var(--color-text)}
    .sidebar-item.active{background:var(--color-primary-highlight);
                         color:var(--color-primary);font-weight:500}
    .sidebar-item svg{flex-shrink:0;width:16px;height:16px}
    .sidebar-item-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
    .sidebar-item-more{opacity:0;width:24px;height:24px;border-radius:var(--radius-sm);
                       display:inline-flex;align-items:center;justify-content:center;
                       color:var(--color-text-muted);flex-shrink:0;
                       transition:opacity var(--transition-interactive),background var(--transition-interactive)}
    .sidebar-item:hover .sidebar-item-more{opacity:1}
    .sidebar-item-more:hover{background:var(--color-surface-dynamic);color:var(--color-text)}
    @media(max-width:960px),(hover:none){
      .sidebar-item-more{opacity:1}
    }
    .sidebar-footer{margin-top:auto;padding:var(--space-4);
                    border-top:1px solid var(--color-divider)}

    /* Main content */
    .main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
    .topbar{display:flex;align-items:center;justify-content:space-between;
            padding:var(--space-2) var(--space-5);min-height:56px;gap:var(--space-3);
            border-bottom:1px solid var(--color-border);
            background:var(--color-surface);flex-shrink:0;flex-wrap:wrap}
    .topbar-left{display:flex;align-items:center;gap:var(--space-2);flex:1 1 auto;min-width:0;overflow:hidden}
    .topbar-right{display:flex;align-items:center;gap:var(--space-2);flex-shrink:0}
    .breadcrumb{display:flex;align-items:center;gap:var(--space-2);
                font-size:var(--text-sm);color:var(--color-text-muted);
                overflow-x:auto;white-space:nowrap;scrollbar-width:none;-ms-overflow-style:none;
                padding:2px 0;min-width:0}
    .breadcrumb::-webkit-scrollbar{display:none}
    .bc-seg{cursor:pointer;color:var(--color-primary);flex-shrink:0}
    .bc-seg.current{color:var(--color-text);cursor:default;font-weight:500}
    .bc-sep{color:var(--color-text-faint);flex-shrink:0}
    .content-area{flex:1;overflow-y:auto;padding:var(--space-6)}

    /* Components */
    .btn{display:inline-flex;align-items:center;gap:var(--space-2);
         padding:var(--space-2) var(--space-4);border-radius:var(--radius-md);
         font-size:var(--text-sm);font-weight:500;cursor:pointer;
         border:1px solid transparent;transition:all var(--transition-interactive)}
    .btn svg{width:14px;height:14px}
    .btn-primary{background:var(--color-primary);color:#090d11;font-weight:600;border-color:var(--color-primary)}
    .btn-primary:hover{background:var(--color-primary-hover);border-color:var(--color-primary-hover);color:#090d11}
    .btn-secondary{background:var(--color-surface-offset);color:var(--color-text);
                   border-color:var(--color-border)}
    .btn-secondary:hover{background:var(--color-surface-dynamic)}
    .btn-danger{background:transparent;color:var(--color-error);border-color:var(--color-error)}
    .btn-danger:hover{background:var(--color-error);color:#fff}
    .btn-ghost{background:transparent;color:var(--color-text-muted)}
    .btn-ghost:hover{background:var(--color-surface-offset);color:var(--color-text)}
    .btn-sm{padding:var(--space-1) var(--space-3);font-size:var(--text-xs)}
    .btn-icon{padding:var(--space-2);border-radius:var(--radius-md);
              display:flex;align-items:center;justify-content:center}

    .card{background:var(--color-surface);border:1px solid var(--color-border);
          border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)}
    .card-header{padding:var(--space-4) var(--space-5);
                 border-bottom:1px solid var(--color-divider);
                 display:flex;align-items:center;justify-content:space-between}
    .card-title{font-weight:600;font-size:var(--text-base)}
    .card-body{padding:var(--space-5)}

    .form-group{display:flex;flex-direction:column;gap:var(--space-2)}
    .form-label{font-size:var(--text-sm);font-weight:500;color:var(--color-text-muted)}
    .form-input{padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);
                border:1px solid var(--color-border);background:var(--color-surface-2);
                font-size:var(--text-sm);width:100%;color:var(--color-text);
                transition:border-color var(--transition-interactive),
                  box-shadow var(--transition-interactive)}
    .form-input:focus{border-color:var(--color-primary);
                      box-shadow:0 0 0 3px oklch(from var(--color-primary) l c h/.15);outline:none}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)}

    /* File browser */
    .file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:var(--space-3)}
    .file-list{display:flex;flex-direction:column;gap:0}
    .file-item-grid{background:var(--color-surface);border:1px solid var(--color-border);
                    border-radius:var(--radius-lg);padding:var(--space-4);
                    cursor:pointer;display:flex;flex-direction:column;align-items:center;
                    gap:var(--space-2);text-align:center;position:relative;
                    transition:all var(--transition-interactive)}
    .file-item-grid.selected{border-color:var(--color-primary);
                             background:oklch(from var(--color-primary) l c h/.1)}
    .grid-dl-btn{position:absolute;top:var(--space-2);right:var(--space-2);
                  opacity:0;transition:opacity var(--transition-interactive);
                  background:var(--color-surface);border-radius:var(--radius-sm);padding:2px}
    .grid-select-cb{position:absolute;top:var(--space-2);left:var(--space-2);
                    width:16px;height:16px;accent-color:var(--color-primary);
                    opacity:0;transition:opacity var(--transition-interactive);cursor:pointer}
    .file-item-grid:hover .grid-dl-btn,
    .file-item-grid:hover .grid-select-cb,
    .file-item-grid.selected .grid-select-cb{opacity:1}
    .file-item-grid:hover{background:var(--color-surface-offset);
                          box-shadow:var(--shadow-md);transform:translateY(-1px)}
    .file-item-list{display:flex;align-items:center;gap:var(--space-3);
                    padding:var(--space-2) var(--space-4);min-height:50px;
                    border-bottom:1px solid var(--color-divider);cursor:pointer;
                    transition:background var(--transition-interactive);min-width:0}
    .file-item-list:hover{background:var(--color-surface-offset)}
    .file-item-list.selected{background:oklch(from var(--color-primary) l c h/.1)}
    .file-item-list:last-child{border-bottom:none}
    .list-select-cb{width:17px;height:17px;accent-color:var(--color-primary);
                    cursor:pointer;flex-shrink:0}
    .file-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;
               border-radius:var(--radius-md);background:var(--color-surface-offset);flex-shrink:0}
    .file-icon-grid{width:48px;height:48px;display:flex;align-items:center;justify-content:center;
                    border-radius:var(--radius-lg);background:var(--color-surface-offset)}
    .file-name{font-size:var(--text-sm);font-weight:500;
               overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;min-width:0}
    .file-meta{font-size:var(--text-xs);color:var(--color-text-muted);
               font-variant-numeric:tabular-nums;flex-shrink:0}
    .file-actions{display:flex;gap:var(--space-1);margin-left:auto;opacity:0;
                  transition:opacity var(--transition-interactive);flex-shrink:0}
    .file-item-list:hover .file-actions{opacity:1}
    .file-more-btn{display:none;margin-left:var(--space-1);flex-shrink:0}
    .file-list-header{display:flex;align-items:center;gap:var(--space-3);
                      padding:var(--space-2) var(--space-4);min-height:38px;
                      border-bottom:1px solid var(--color-divider);
                      background:var(--color-surface-offset);
                      border-radius:var(--radius-lg) var(--radius-lg) 0 0;
                      font-size:var(--text-xs);font-weight:600;color:var(--color-text-muted);
                      user-select:none}
    .file-sort-col{display:inline-flex;align-items:center;gap:4px;cursor:pointer;
                   color:var(--color-text-muted);transition:color var(--transition-interactive)}
    .file-sort-col:hover,.file-sort-col.active{color:var(--color-text)}
    .file-sort-col.active{color:var(--color-primary)}
    .sort-group{display:inline-flex;align-items:center;background:var(--color-surface-offset);
                border:1px solid var(--color-border);border-radius:var(--radius-md);
                padding:2px;gap:2px}
    .sort-select{background:transparent;border:none;color:var(--color-text);
                 font-size:var(--text-xs);font-weight:500;padding:3px 6px;
                 border-radius:calc(var(--radius-md) - 2px);cursor:pointer;outline:none}
    .sort-select option{background:var(--color-surface);color:var(--color-text)}
    .sort-dir-btn{padding:4px 6px;border-radius:calc(var(--radius-md) - 2px);
                  color:var(--color-text-muted);display:inline-flex;align-items:center;
                  justify-content:center;transition:all var(--transition-interactive)}
    .sort-dir-btn:hover{background:var(--color-surface);color:var(--color-text)}

    /* Batch selection bar */
    .batch-bar{display:flex;align-items:center;justify-content:space-between;
               gap:var(--space-3);padding:var(--space-2) var(--space-4);
               margin-bottom:var(--space-3);background:var(--color-surface);
               border:1px solid var(--color-primary);border-radius:var(--radius-lg);
               box-shadow:var(--shadow-sm);flex-wrap:wrap}
    .batch-bar-left{display:flex;align-items:center;gap:var(--space-3);font-size:var(--text-sm);font-weight:500}
    .batch-count{font-family:var(--font-mono);font-size:var(--text-xs);
                 background:var(--color-primary);color:#fff;padding:2px 8px;
                 border-radius:var(--radius-sm);font-variant-numeric:tabular-nums}
    .batch-bar-actions{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}

    /* Right-click context menu */
    .context-menu{position:fixed;z-index:300;min-width:200px;
                  background:var(--color-surface-2);border:1px solid var(--color-border);
                  border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
                  padding:var(--space-1);display:none;flex-direction:column;
                  animation:ctx-in 120ms cubic-bezier(.16,1,.3,1)}
    @keyframes ctx-in{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
    .ctx-item{display:flex;align-items:center;gap:var(--space-3);
              padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);
              font-size:var(--text-sm);color:var(--color-text);cursor:pointer;
              text-align:left;width:100%}
    .ctx-item svg{width:15px;height:15px;color:var(--color-text-muted);flex-shrink:0}
    .ctx-item:hover{background:var(--color-surface-offset)}
    .ctx-item:hover svg{color:var(--color-text)}
    .ctx-item.danger{color:var(--color-error)}
    .ctx-item.danger svg{color:var(--color-error)}
    .ctx-item.danger:hover{background:oklch(from var(--color-error) l c h/.12)}
    .ctx-divider{height:1px;background:var(--color-divider);margin:var(--space-1) 0}

    /* Media player controls */
    .media-controls-bar{display:flex;align-items:center;justify-content:space-between;
                        gap:var(--space-3);padding:var(--space-2) var(--space-3);
                        background:var(--color-surface-offset);border-radius:var(--radius-md);
                        flex-wrap:wrap}
    .media-nav-group{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
    .media-track-badge{font-family:var(--font-mono);font-size:var(--text-xs);
                       color:var(--color-text-muted);font-variant-numeric:tabular-nums;
                       padding:0 var(--space-1)}
    .speed-group,.zoom-group{display:inline-flex;align-items:center;background:var(--color-surface);
                             border:1px solid var(--color-border);border-radius:var(--radius-md);
                             padding:2px;gap:2px}
    .speed-btn,.zoom-btn{font-family:var(--font-mono);font-size:11px;padding:2px 6px;
                         border-radius:calc(var(--radius-sm) - 1px);color:var(--color-text-muted);
                         font-variant-numeric:tabular-nums;cursor:pointer}
    .speed-btn:hover,.zoom-btn:hover{color:var(--color-text)}
    .speed-btn.active,.zoom-btn.active{background:var(--color-primary);color:#fff;font-weight:500}
    .video-stage{position:relative;width:100%;max-height:66vh;background:#000;
                 border-radius:var(--radius-md);overflow:hidden;
                 display:flex;align-items:center;justify-content:center;user-select:none}
    .video-stage video{width:100%;max-height:66vh;display:block;background:#000;
                       transform-origin:center center;transition:transform 160ms ease;cursor:pointer}

      max-height:100vh;width:100vw;height:100vh;border-radius:0;background:#000;
    }
    .video-stage:fullscreen video,.video-stage:-webkit-full-screen video{
      max-height:100vh;width:100vw;height:100vh;object-fit:contain;
    }

    .video-stage-hud{position:absolute;left:0;right:0;bottom:0;z-index:10;
                     background:linear-gradient(to top, rgba(0,0,0,.88) 0%, rgba(0,0,0,.62) 68%, transparent 100%);

    .video-hud-row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);flex-wrap:wrap}

    .hud-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;
             border-radius:var(--radius-sm);background:rgba(255,255,255,.14);
             color:#fff;font-size:11px;font-family:var(--font-mono);font-weight:500;
             border:1px solid rgba(255,255,255,.16);cursor:pointer;
             transition:background 120ms ease}
    .hud-btn:hover{background:rgba(255,255,255,.26)}
    .hud-btn.active{background:var(--color-primary);border-color:var(--color-primary);color:#fff}
    .hud-pill-group{display:inline-flex;align-items:center;background:rgba(0,0,0,.55);

                    padding:2px;gap:2px}
    .hud-pill{font-family:var(--font-mono);font-size:11px;padding:2px 6px;
              border-radius:calc(var(--radius-sm) - 1px);color:rgba(255,255,255,.78);cursor:pointer}
    .hud-pill:hover{color:#fff}
    .hud-pill.active{background:var(--color-primary);color:#fff;font-weight:600}
    .hud-select{background:rgba(0,0,0,.62);color:#fff;border:1px solid rgba(255,255,255,.22);
                border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:11px;
                padding:2px 6px;height:24px;cursor:pointer;outline:none;max-width:170px}
    .hud-select:hover{border-color:rgba(255,255,255,.4)}

    video::cue{background:rgba(0,0,0,.78);color:#fff;font-family:var(--font-body);
               font-size:clamp(.95rem,1.8vw,1.35rem);text-shadow:0 1px 3px rgba(0,0,0,.9)}

    .toolbar{display:flex;align-items:center;gap:var(--space-2);
             margin-bottom:var(--space-5);flex-wrap:wrap}
    .view-toggle{display:flex;background:var(--color-surface-offset);
                 border-radius:var(--radius-md);padding:2px;gap:2px}
    .view-btn{padding:var(--space-1) var(--space-2);border-radius:calc(var(--radius-md) - 2px);
              color:var(--color-text-muted);transition:all var(--transition-interactive)}
    .view-btn.active{background:var(--color-surface);color:var(--color-text);
                     box-shadow:var(--shadow-sm)}

    .badge{display:inline-flex;align-items:center;gap:var(--space-1);
           padding:2px var(--space-2);border-radius:var(--radius-full);
           font-size:var(--text-xs);font-weight:500}
    .badge-primary{background:var(--color-primary-highlight);color:var(--color-primary)}
    .badge-success{background:oklch(from var(--color-success) l c h/.15);color:var(--color-success)}
    .badge-error{background:oklch(from var(--color-error) l c h/.15);color:var(--color-error)}

    .modal-backdrop{position:fixed;inset:0;background:oklch(0 0 0/.5);
                    backdrop-filter:blur(4px);z-index:100;display:flex;
                    align-items:center;justify-content:center;padding:var(--space-4)}
    .modal{background:var(--color-surface);border:1px solid var(--color-border);
           border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);
           width:100%;max-width:480px;max-height:calc(100dvh - 24px);
           display:flex;flex-direction:column;overflow:hidden;
           animation:modal-in .2s ease}
    @keyframes modal-in{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
    .modal-header{padding:var(--space-4) var(--space-5);
                  border-bottom:1px solid var(--color-divider);
                  display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
    .modal-title{font-weight:600;font-size:var(--text-base)}
    .modal-body{padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-4);
                overflow-y:auto;flex:1}
    .modal-footer{padding:var(--space-4) var(--space-5);
                  border-top:1px solid var(--color-divider);
                  display:flex;justify-content:flex-end;gap:var(--space-3);flex-shrink:0;flex-wrap:wrap}

    .dropzone{border:2px dashed var(--color-border);border-radius:var(--radius-lg);
              padding:var(--space-10);text-align:center;
              transition:all var(--transition-interactive);color:var(--color-text-muted)}
    .dropzone.drag-over{border-color:var(--color-primary);
                        background:var(--color-primary-highlight);color:var(--color-primary)}

    .toast-container{position:fixed;bottom:var(--space-6);right:var(--space-6);
                     display:flex;flex-direction:column;gap:var(--space-2);z-index:200}
    .toast{background:var(--color-surface-2);border:1px solid var(--color-border);
           border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);
           box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:var(--space-3);
           font-size:var(--text-sm);min-width:260px;max-width:380px;
           animation:toast-in .3s ease}
    @keyframes toast-in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}

    .toast.error{border-color:var(--color-error)}
    .toast-icon{flex-shrink:0;width:16px;height:16px}
    .toast.success .toast-icon{color:var(--color-success)}
    .toast.error .toast-icon{color:var(--color-error)}

    .progress-track{width:100%;height:6px;background:var(--color-surface-dynamic);
                    border-radius:var(--radius-full);overflow:hidden;position:relative}
    .progress-fill{height:100%;background:var(--color-primary);border-radius:var(--radius-full);
                   transition:width 120ms linear;width:0%}
    .progress-fill.done{background:var(--color-success)}
    .progress-fill.error{background:var(--color-error)}

                    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
    .dl-toast-meta{display:flex;align-items:center;justify-content:space-between;
                   font-size:var(--text-xs);color:var(--color-text-muted);font-family:var(--font-mono)}

    .login-card{background:var(--color-surface);border:1px solid var(--color-border);
                border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);
                width:100%;max-width:380px;padding:var(--space-10)}
    .login-logo{display:flex;align-items:center;gap:var(--space-3);
                margin-bottom:var(--space-8)}
    .login-title{font-size:var(--text-xl);font-weight:700;letter-spacing:-.02em}

    .settings-wrap{max-width:1080px;width:100%;display:flex;flex-direction:column;gap:var(--space-5)}
    .settings-header{display:flex;flex-direction:column;align-items:flex-start;gap:var(--space-3)}
    .settings-tabs{display:flex;align-items:center;gap:4px;background:var(--color-surface);
                   border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:4px;
                   flex-wrap:wrap;max-width:100%}
    .settings-tab{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;
                  border-radius:var(--radius-md);font-size:var(--text-xs);font-weight:500;
                  color:var(--color-text-muted);white-space:nowrap;cursor:pointer;flex-shrink:0;
                  transition:all var(--transition-interactive)}
    .settings-tab svg{width:14px;height:14px;flex-shrink:0}
    .settings-tab:hover{color:var(--color-text);background:var(--color-surface-offset)}
    .settings-tab.active{background:var(--color-primary);color:#090d11;font-weight:600}
    .settings-grid{display:grid;gap:var(--space-5)}
    .settings-two-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:var(--space-5);align-items:start}
    .admin-mode-banner{background:var(--color-surface);border:1px solid var(--color-border);
                       border-radius:var(--radius-lg);padding:var(--space-4) var(--space-5);
                       display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap}
    .admin-mode-banner.unlocked{border-color:var(--color-primary);box-shadow:0 0 0 1px color-mix(in oklab, var(--color-primary) 35%, transparent)}
    .pin-input{font-family:var(--font-mono);font-size:var(--text-lg);letter-spacing:0.35em;text-align:center;font-weight:700}
    .share-list{display:flex;flex-direction:column;gap:var(--space-3)}
    .share-item{background:var(--color-surface-2);border:1px solid var(--color-border);
                border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);
                display:flex;align-items:center;gap:var(--space-3);
                transition:border-color var(--transition-interactive)}
    .share-item:hover{border-color:var(--color-primary)}
    .share-icon-box{width:38px;height:38px;border-radius:var(--radius-md);
                    background:var(--color-surface-offset);color:var(--color-primary);
                    display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .share-info{flex:1;min-width:0}
    .share-title-row{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
    .share-name{font-weight:600;font-size:var(--text-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .share-host{font-size:var(--text-xs);color:var(--color-text-muted);
                font-family:var(--font-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
    .share-actions{display:flex;align-items:center;gap:var(--space-1);flex-shrink:0}
    .proxy-share-card{background:var(--color-surface-2);border:1px solid var(--color-border);
                      border-radius:var(--radius-lg);padding:var(--space-4);
                      display:flex;flex-direction:column;gap:var(--space-3);
                      transition:border-color var(--transition-interactive)}
    .proxy-share-card.disabled{opacity:.72}
    .proxy-share-top{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap}
    .proxy-share-controls{display:grid;grid-template-columns:1fr auto;gap:var(--space-2);align-items:center}
    .proxy-switch-label{display:inline-flex;align-items:center;gap:var(--space-2);cursor:pointer;
                        font-size:var(--text-xs);font-weight:600;color:var(--color-text);user-select:none}
    .proxy-switch{position:relative;width:38px;height:22px;background:var(--color-surface-dynamic);
                  border:1px solid var(--color-border);border-radius:var(--radius-full);
                  transition:all var(--transition-interactive);flex-shrink:0}
    .proxy-switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;
                         border-radius:50%;background:var(--color-text-muted);
                         transition:all var(--transition-interactive)}
    .proxy-switch-input{position:absolute;opacity:0;width:0;height:0}
    .proxy-switch-input:checked + .proxy-switch{background:var(--color-primary);border-color:var(--color-primary)}
    .proxy-switch-input:checked + .proxy-switch::after{transform:translateX(16px);background:#fff}
    .lockout-alert{background:oklch(from var(--color-error) l c h/.12);border:1px solid var(--color-error);
                   color:var(--color-error);border-radius:var(--radius-md);padding:var(--space-3);
                   font-size:var(--text-xs);line-height:1.45;display:flex;align-items:flex-start;gap:var(--space-2)}
    .lockout-alert svg{width:16px;height:16px;flex-shrink:0;margin-top:1px}

    .spinner{width:20px;height:20px;border:2px solid var(--color-border);
             border-top-color:var(--color-primary);border-radius:50%;
             animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading-state{display:flex;align-items:center;justify-content:center;
                   padding:var(--space-16);color:var(--color-text-muted)}

    .empty-state{display:flex;flex-direction:column;align-items:center;
                 text-align:center;padding:var(--space-16) var(--space-8);
                 color:var(--color-text-muted)}
    .empty-state svg{width:48px;height:48px;margin-bottom:var(--space-4);
                     color:var(--color-text-faint)}
    .empty-state h3{color:var(--color-text);margin-bottom:var(--space-2)}
    .empty-state p{max-width:36ch;margin-bottom:var(--space-6)}

    /* Tablet & Touch responsiveness (<= 960px) */
    @media(max-width:960px), (hover:none){
      .grid-dl-btn,
      .grid-select-cb{opacity:1}
      .file-actions{display:none}
      .file-more-btn{display:inline-flex;min-width:36px;min-height:36px}
      .file-date-col{display:none}
    }

    @media(max-width:900px){
      .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:60;
               width:min(270px, 84vw);margin-left:0 !important;
               transform:translateX(-100%);box-shadow:var(--shadow-lg)}
      .sidebar.open{transform:translateX(0)}
      .main{width:100%}
      .content-area{padding:var(--space-4)}
      .topbar{padding:var(--space-2) var(--space-4)}
      .file-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
    }

    @media(max-width:640px){
      .content-area{padding:var(--space-3)}
      .topbar{padding:var(--space-2) var(--space-3);gap:var(--space-2)}
      .topbar-right .btn-label{display:none}
      .topbar-right .btn-sm{padding:var(--space-2) var(--space-2)}
      .form-row{grid-template-columns:1fr}
      .file-grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:var(--space-2)}
      .file-item-grid{padding:var(--space-3)}
      .file-item-list{padding:var(--space-2) var(--space-3);gap:var(--space-2)}
      .file-size-col{min-width:auto !important;font-size:11px}

      .batch-bar-actions{width:100%;justify-content:flex-start}
      .modal-backdrop{padding:var(--space-2)}
      .modal-header,.modal-body,.modal-footer{padding:var(--space-3) var(--space-4)}

  </style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">

        <circle cx="22" cy="8" r="2" fill="currentColor"/>

      <button class="btn btn-primary" type="submit" id="login-btn" style="margin-top:var(--space-2)">Sign in</button>
    </form>
  </div>
</div>

<div id="app" style="display:none">
  <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeMobileSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a class="sidebar-header-link" href="https://github.com/Sage222/SageDrive2" target="_blank" rel="noopener noreferrer" title="Open SageDrive on GitHub">
        <svg class="sidebar-logo" viewBox="0 0 28 28" fill="none">
          <rect width="28" height="28" rx="7" fill="currentColor" opacity=".12"/>
          <path d="M6 20L11 8l3 7 3-5 5 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="22" cy="8" r="2" fill="currentColor"/>
        </svg>
        <span class="sidebar-title">SageDrive</span>
      </a>
      <button class="btn btn-ghost btn-icon" onclick="toggleSidebar()" title="Collapse menu" aria-label="Collapse menu">
        <svg data-lucide="panel-left-close" width="18" height="18"></svg>
      </button>
    </div>

    <div style="flex:1;padding:var(--space-3) 0">
      <div class="sidebar-section">
        <span>Drives</span>

          <svg data-lucide="plus" width="13" height="13"></svg>
        </button>
      </div>
      <div id="sidebar-drives"></div>
      <div class="sidebar-section" style="margin-top:var(--space-4)">App</div>
      <div class="sidebar-item" data-view="settings" onclick="setView('settings')">

        <span class="sidebar-item-label">Settings</span>

    </div>

    <div class="sidebar-footer">

            Read-Only

        <div style="display:flex;gap:var(--space-1);flex-shrink:0">
          <button class="btn-ghost btn-icon btn" onclick="cycleTheme()" title="Switch dark theme" aria-label="Switch dark theme">

  <div class="main">

      </div>
      <div class="topbar-right" id="topbar-actions"></div>
    </div>
    <div class="content-area" id="content-area"></div>
  </div>
</div>

<div class="toast-container" id="toasts"></div>
<div id="modal-root"></div>
<div class="context-menu" id="context-menu"></div>

  {

let _activeTheme = 'obsidian';
function applyTheme(themeId, persistLocal = true) {
  let clean = String(themeId || 'obsidian').trim().toLowerCase();
  if (clean === 'dark' || !DARK_THEMES.some(t => t.id === clean)) {
    clean = 'obsidian';
  }
  _activeTheme = clean;
  document.documentElement.setAttribute('data-theme', clean);
  if (persistLocal) {
    try { localStorage.setItem('sd_theme', clean); } catch (_) {}
  }
}
try {
  const savedLocalTheme = localStorage.getItem('sd_theme');
  if (savedLocalTheme) applyTheme(savedLocalTheme, false);
} catch (_) {}

async function apiFetch(path, opts={}) {
  const headers = { ...(opts.headers||{}) };
  if (_token) headers['Authorization'] = `Bearer ${_token}`;
  if (opts.json) {
    headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(opts.json);
    delete opts.json;
  }
  const r = await fetch(API + path, {...opts, headers});
  if (r.status === 401 && !path.startsWith('/api/auth/login')) {
    doLogout();
    throw new Error('Unauthorised');
  }
  return r;
}

async function apiJSON(path, opts={}) {
  const r = await apiFetch(path, opts);
  if (!r.ok) {
    const errData = await r.json().catch(()=>({error:'Request failed'}));
    const err = new Error(errData.error || 'Request failed');
    err.status = r.status;
    err.locked = Boolean(errData.locked);
    err.retry_after = Number(errData.retry_after || 0);
    err.attempts_remaining = errData.attempts_remaining;
    throw err;
  }
  return r.json();
}

function clearLoginLockoutTimer() {
  if (_loginLockoutTimer) {
    clearInterval(_loginLockoutTimer);
    _loginLockoutTimer = null;
  }
}

function fmtLockoutCountdown(sec) {
  const s = Math.max(0, Math.ceil(sec));
  const m = Math.floor(s / 60);
  const rem = s % 60;
  return m > 0 ? `${m}m ${String(rem).padStart(2, '0')}s` : `${rem}s`;
}

document.getElementById('login-user').addEventListener('input', () => {
  clearLoginLockoutTimer();
  const btn = document.getElementById('login-btn');
  if (btn) {
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }
});

document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  clearLoginLockoutTimer();
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  try {
    const data = await apiJSON('/api/auth/login', {
      method:'POST',
      json:{
        username: document.getElementById('login-user').value,
        password: document.getElementById('login-pass').value,
      }
    });
    _token = data.token;
    _adminMode = false;
    sessionStorage.setItem('sd_token', _token);
    if (data.theme) applyTheme(data.theme, true);
    await initApp();
  } catch(err) {
    if (err.locked && err.retry_after > 0) {
      let remaining = err.retry_after;
      const renderLockMsg = () => {
        errEl.innerHTML = `<div class="lockout-alert">
          <svg data-lucide="shield-alert"></svg>
          <div>
            <div style="font-weight:600;margin-bottom:2px">Account Temporarily Locked</div>
            <div>Too many failed login attempts (5 max). Try again in <strong style="font-family:var(--font-mono)">${fmtLockoutCountdown(remaining)}</strong>.</div>
          </div>
        </div>`;
        lucide.createIcons();
      };
      errEl.style.display = 'block';
      renderLockMsg();
      btn.disabled = true;
      btn.textContent = `Locked (${fmtLockoutCountdown(remaining)})`;
      _loginLockoutTimer = setInterval(() => {
        remaining -= 1;
        if (remaining <= 0) {
          clearLoginLockoutTimer();
          errEl.style.display = 'none';
          btn.disabled = false;
          btn.textContent = 'Sign in';
        } else {
          renderLockMsg();
          btn.textContent = `Locked (${fmtLockoutCountdown(remaining)})`;
        }
      }, 1000);
      return;
    } else {
      errEl.innerHTML = `<div class="lockout-alert">
        <svg data-lucide="alert-circle"></svg>
        <div>${escHtml(err.message)}</div>
      </div>`;
      errEl.style.display = 'block';
      lucide.createIcons();
    }
  } finally {
    if (!_loginLockoutTimer) {
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  }
});

async function submitAdminPinModal() {
  const inp = document.getElementById('admin-pin-input');
  const errEl = document.getElementById('admin-pin-error');
  const btn = document.getElementById('admin-pin-submit-btn');
  const pin = (inp ? inp.value : '').trim();
  if (!pin) {
    if (errEl) {
      errEl.textContent = 'Please enter the Administrator PIN.';
      errEl.style.display = 'block';
    }
    return;
  }
  if (btn) btn.disabled = true;
  if (errEl) errEl.style.display = 'none';
  try {
    const res = await apiJSON('/api/auth/admin-mode', {
      method: 'POST',
      json: { enabled: true, pin }
    });
    _adminMode = Boolean(res.admin_enabled);
    if (_user) _user.admin_enabled = _adminMode;
    updateAdminModeBadgeUI();
    closeModal();
    toast('Administrator Functions enabled', 'success');
    refreshCurrentViewAfterAdminToggle();
  } catch (e) {
    if (errEl) {
      errEl.textContent = e.message || 'Invalid Administrator PIN';
      errEl.style.display = 'block';
    }
    if (inp) {
      inp.value = '';
      inp.focus();
    }
  } finally {
    if (btn) btn.disabled = false;
  }
}

function smbBreadcrumbs() {
  const parts = _path.split('/').filter(Boolean);
  const crumbs = [{name: _activeDrive.name, target: '/'}];
  let built = '';
  for (let i = 0; i < parts.length; i++) {
    built += '/' + parts[i];
    crumbs.push({name: parts[i], target: built});
  }
  return crumbs;
}

  const f = parseFileArg(fJson);
  const key = itemKey(f, type);
  if (_selectedItems.has(key)) {
    _selectedItems.delete(key);
  } else {
    _selectedItems.set(key, f);

  if (_currentFiles.length) {
    renderFileView(_currentFiles, type, true);
  }

  if (_selectedItems.size === _currentFiles.length && _currentFiles.length > 0) {
    _selectedItems.clear();

    for (const f of _currentFiles) {

  renderFileView(_currentFiles, type, true);
}

function fileTimestamp(f) {
  if (!f || !f.modified) return 0;
  if (typeof f.modified === 'number') return f.modified * 1000;
  const t = new Date(f.modified).getTime();
  return Number.isFinite(t) ? t : 0;
}

function sortFilesList(files) {
  const dir = _sortDir === 'desc' ? -1 : 1;
  return files.sort((a, b) => {
    if (a.type !== b.type) return a.type === 'folder' ? -1 : 1;
    let cmp = 0;
    if (_sortBy === 'size') {
      cmp = (Number(a.size) || 0) - (Number(b.size) || 0);
    } else if (_sortBy === 'date') {
      cmp = fileTimestamp(a) - fileTimestamp(b);
    }
    if (cmp === 0) {
      cmp = String(a.name || '').localeCompare(String(b.name || ''), undefined, { numeric: true, sensitivity: 'base' });
    }
    return cmp * dir;
  });
}

function fmtSize(bytes) {
  if (!bytes) return '—';

  if (bytes < 1048576) return (bytes/1024).toFixed(1)+'KB';
  if (bytes < 1073741824) return (bytes/1048576).toFixed(1)+'MB';
  return (bytes/1073741824).toFixed(2)+'GB';
}

function fmtDate(ts) {
  if (!ts) return '';

function _fileExt(nameOrObj) {
  var name = (typeof nameOrObj === 'object' && nameOrObj !== null) ? nameOrObj.name : nameOrObj;
  var m = String(name || '').toLowerCase().match(/\.([^.]+)$/);
  return m ? m[1] : '';
}
function _fileMime(nameOrObj) {
  if (typeof nameOrObj === 'object' && nameOrObj !== null && nameOrObj.mimeType) {
    return String(nameOrObj.mimeType).toLowerCase();
  }
  return '';
}
function isVideoFile(nameOrObj) {
  var ext = _fileExt(nameOrObj);
  var mime = _fileMime(nameOrObj);
  if (['mp4','webm','ogg','ogv','mov','m4v','mkv','avi','3gp','ts','m2ts','flv','wmv','mpg','mpeg','vob','divx'].indexOf(ext) !== -1) return true;
  return mime.indexOf('video/') === 0;
}
function isAudioFile(nameOrObj) {
  var ext = _fileExt(nameOrObj);
  var mime = _fileMime(nameOrObj);
  if (['mp3','wav','ogg','oga','m4a','aac','flac','opus','weba','wma','aiff','aif','alac','amr','mid','midi','eac3','ec3','ac3','dts','mka','mp2'].indexOf(ext) !== -1) return true;
  return mime.indexOf('audio/') === 0;
}
function isImageFile(nameOrObj) {
  var ext = _fileExt(nameOrObj);
  var mime = _fileMime(nameOrObj);
  if (['jpg','jpeg','png','gif','webp','svg','bmp','ico','avif','jfif','apng'].indexOf(ext) !== -1) return true;
  return mime.indexOf('image/') === 0;
}
function isPdfFile(nameOrObj) {
  var ext = _fileExt(nameOrObj);
  var mime = _fileMime(nameOrObj);
  return ext === 'pdf' || mime === 'application/pdf';
}
function isTextFile(nameOrObj) {
  var ext = _fileExt(nameOrObj);
  var mime = _fileMime(nameOrObj);
  if (['txt','md','markdown','json','js','mjs','cjs','ts','tsx','jsx','py','sh','bash','zsh','html','htm','css','scss','xml','yaml','yml','toml','ini','conf','cfg','env','log','csv','sql','dockerfile','gitignore'].indexOf(ext) !== -1) return true;
  return mime.indexOf('text/') === 0 || mime === 'application/json' || mime === 'application/xml';
}
function getMediaMime(nameOrObj) {
  const ext = _fileExt(nameOrObj);
  const map = {
    mp4:'video/mp4', m4v:'video/mp4', mov:'video/mp4',
    webm:'video/webm', mkv:'video/mp4', ogv:'video/ogg', avi:'video/mp4',
    mp3:'audio/mpeg', wav:'audio/wav', ogg:'audio/ogg', oga:'audio/ogg',
    opus:'audio/ogg', m4a:'audio/mp4', aac:'audio/aac', flac:'audio/flac',
    weba:'audio/webm', wma:'audio/mpeg', aiff:'audio/aiff', aif:'audio/aiff',
    eac3:'audio/mpeg', ec3:'audio/mpeg', ac3:'audio/mpeg', dts:'audio/mpeg'
  };
  return map[ext] || (isVideoFile(nameOrObj) ? 'video/mp4' : 'audio/mpeg');
}
function mediaApiUrl(f, type) {
  var t = encodeURIComponent(_token || '');
  if (type === 'smb') {
    return '/api/smb/download/' + _activeDrive.id

}

function mediaSubtitleUrl(f, type, trackIdx, startSec) {

let _activeMediaAbort = null;
let _activeMediaBlobUrl = null;
let _activeSubBlobUrl = null;
let _activeMediaState = null;
let _hudIdleTimer = null;
let _btAudioDelayEnabled = false;
let _sharedBtAudioCtx = null;

function applyBtAudioDelayToPlayer(player) {
  if (!player) return;
  try {
    if (!player._btAudioGraph) {
      if (!_btAudioDelayEnabled) return;
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      if (!_sharedBtAudioCtx) {
        _sharedBtAudioCtx = new AudioCtx();
      }
      if (_sharedBtAudioCtx.state === 'suspended') {
        _sharedBtAudioCtx.resume().catch(() => {});
      }
      const source = _sharedBtAudioCtx.createMediaElementSource(player);
      const delayNode = _sharedBtAudioCtx.createDelay(1.0);
      delayNode.delayTime.value = _btAudioDelayEnabled ? 0.03 : 0;
      source.connect(delayNode);
      delayNode.connect(_sharedBtAudioCtx.destination);
      player._btAudioGraph = { source, delayNode };
    } else {
      if (_sharedBtAudioCtx && _sharedBtAudioCtx.state === 'suspended') {
        _sharedBtAudioCtx.resume().catch(() => {});
      }
      const targetDelay = _btAudioDelayEnabled ? 0.03 : 0;
      if (_sharedBtAudioCtx) {
        player._btAudioGraph.delayNode.delayTime.setTargetAtTime(targetDelay, _sharedBtAudioCtx.currentTime, 0.005);
      } else {
        player._btAudioGraph.delayNode.delayTime.value = targetDelay;
      }
    }
  } catch (_) {}
}

function updateBtDelayButtons() {
  document.querySelectorAll('.bt-delay-btn').forEach(btn => {
    btn.classList.toggle('active', _btAudioDelayEnabled);
    if (btn.classList.contains('btn')) {

      btn.classList.toggle('btn-secondary', !_btAudioDelayEnabled);
    }

      : 'Bluetooth Audio Delay: OFF (Click for +30ms audio delay)';

}

function toggleBtAudioDelay() {
  _btAudioDelayEnabled = !_btAudioDelayEnabled;
  const player = document.getElementById('active-media-player');

  const stage = document.getElementById('video-stage-container');
  if (stage && stage._wakeHud) stage._wakeHud();

function cleanupActiveMedia() {
  if (_activeMediaState && _activeMediaState.skipDebounceTimer) {
    clearTimeout(_activeMediaState.skipDebounceTimer);
  }
  if (_hudIdleTimer) {
    clearTimeout(_hudIdleTimer);
    _hudIdleTimer = null;
  }
  _activeMediaState = null;
  if (_activeMediaAbort) {
    try { _activeMediaAbort.abort(); } catch(_) {}
    _activeMediaAbort = null;
  }
  const player = document.getElementById('active-media-player');
  if (player) {
    try {
      if (player._btAudioGraph) {
        try { player._btAudioGraph.source.disconnect(); } catch (_) {}
        try { player._btAudioGraph.delayNode.disconnect(); } catch (_) {}
        player._btAudioGraph = null;
      }
      player.onerror = null;
      player.onloadeddata = null;
      player.oncanplay = null;
      player.onwaiting = null;
      player.onplaying = null;
      player.onpause = null;
      player.onplay = null;
      player.onended = null;
      player.ontimeupdate = null;
      player.onseeking = null;
      player.pause();
      player.querySelectorAll('track').forEach(t => t.remove());
      player.removeAttribute('src');
      player.load();
    } catch(_) {}
  }
  if (_activeMediaBlobUrl) {
    try { URL.revokeObjectURL(_activeMediaBlobUrl); } catch(_) {}
    _activeMediaBlobUrl = null;
  }
  if (_activeSubBlobUrl) {
    try { URL.revokeObjectURL(_activeSubBlobUrl); } catch(_) {}
    _activeSubBlobUrl = null;
  }

async function fallbackStreamMedia(src, f, player, statusWrap, statusText, statusPct, statusFill, forceTranscodeMode) {
  if (_activeMediaAbort) {
    try { _activeMediaAbort.abort(); } catch(_) {}
    _activeMediaAbort = null;
  }
  if (_activeMediaBlobUrl) {
    try { URL.revokeObjectURL(_activeMediaBlobUrl); } catch(_) {}
    _activeMediaBlobUrl = null;
  }
  const ctrl = new AbortController();
  _activeMediaAbort = ctrl;
  const ext = _fileExt(f);
  const isVid = isVideoFile(f);
  const needsVidTranscode = isVid && (forceTranscodeMode || ['mkv', 'avi', 'wmv', 'flv', 'ts', 'm2ts', 'mpg', 'mpeg', 'vob', 'divx'].includes(ext));
  const needsAudTranscode = !isVid && (forceTranscodeMode || ['wma', 'aiff', 'aif', 'alac', 'eac3', 'ec3', 'ac3', 'dts', 'mka', 'mp2'].includes(ext));
  const audioTrackIdx = _activeMediaState ? (_activeMediaState.audioTrack || 0) : 0;
  const fetchUrl = needsVidTranscode
    ? (src + '&transcode=1&mode=full&audio_track=' + audioTrackIdx)
    : (needsAudTranscode ? (src + '&transcode=audio') : src);

  statusWrap.style.display = 'flex';
  statusText.textContent = (needsVidTranscode || needsAudTranscode)
    ? 'Transcoding & buffering stream…'
    : 'Buffering media stream…';
  statusPct.textContent = '0%';
  statusFill.classList.remove('indeterminate', 'error', 'done');
  statusFill.style.width = '0%';

  try {
    const r = await apiFetch(fetchUrl, { signal: ctrl.signal });
    if (!r.ok) throw new Error('Stream failed (' + r.status + ')');

    const total = parseInt(r.headers.get('Content-Length') || '0', 10) || f.size || 0;
    if (!total || needsVidTranscode || needsAudTranscode) statusFill.classList.add('indeterminate');

    const reader = r.body.getReader();
    const chunks = [];
    let received = 0;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.byteLength;
      if (total > 0 && !needsVidTranscode && !needsAudTranscode) {
        const pct = Math.min(100, Math.round((received / total) * 100));
        statusFill.style.width = pct + '%';
        statusPct.textContent = `${pct}% (${fmtSize(received)} / ${fmtSize(total)})`;
      } else {
        statusPct.textContent = fmtSize(received);
      }
    }

    const mime = needsVidTranscode
      ? 'video/mp4'
      : (needsAudTranscode ? 'audio/mpeg' : getMediaMime(f));
    const blob = new Blob(chunks, { type: mime });
    _activeMediaBlobUrl = URL.createObjectURL(blob);
    player.onerror = null;
    player.ontimeupdate = null;
    player.src = _activeMediaBlobUrl;
    player.playbackRate = _playbackRate;
    statusWrap.style.display = 'none';
    player.play().catch(() => {});
  } catch (err) {
    if (err.name === 'AbortError') return;
    statusFill.classList.remove('indeterminate');
    statusFill.classList.add('error');
    statusFill.style.width = '100%';
    statusText.textContent = 'Playback error: ' + err.message;
  }
}

function toggleMediaPlayPause() {

  } else {

function getMediaCurrentTime() {
  if (!_activeMediaState) return 0;
  if (typeof _activeMediaState.pendingSeekTarget === 'number' && Number.isFinite(_activeMediaState.pendingSeekTarget)) {
    return _activeMediaState.pendingSeekTarget;
  }
  const player = document.getElementById('active-media-player');
  const pTime = (!_activeMediaState.awaitingMetadata && player && Number.isFinite(player.currentTime))
    ? player.currentTime
    : 0;
  return Math.max(0, (_activeMediaState.seekOffset || 0) + pTime);
}

function skipMediaBy(deltaSec) {
  if (!_activeMediaState || !_activeMediaState.seekTo) return;
  const state = _activeMediaState;
  const cur = getMediaCurrentTime();
  const maxDur = state.totalDuration > 0 ? Math.max(0, state.totalDuration - 0.5) : Infinity;
  const target = Math.max(0, Math.min(maxDur, cur + (Number(deltaSec) || 0)));

  const stage = document.getElementById('video-stage-container');
  if (stage && stage._wakeHud) stage._wakeHud();

  // Update timeline UI immediately for instant feedback on rapid skips
  state.pendingSeekTarget = target;
  const rounded = String(Math.round(target * 10) / 10);
  const fmt = fmtMediaTime(target);
  const s1 = document.getElementById('media-timeline-slider');
  const s2 = document.getElementById('stage-timeline-slider');
  const t1 = document.getElementById('media-time-current');
  const t2 = document.getElementById('stage-time-current');
  if (s1) s1.value = rounded;
  if (s2) s2.value = rounded;
  if (t1) t1.textContent = fmt;
  if (t2) t2.textContent = fmt;

  if (state.skipDebounceTimer) {
    clearTimeout(state.skipDebounceTimer);
    state.skipDebounceTimer = null;
  }

  // In direct or blob mode, seek immediately; in remux/full mode, debounce 160ms so multiple clicks accumulate cleanly
  if (state.mode === 'direct' || _activeMediaBlobUrl) {
    state.pendingSeekTarget = null;
    state.seekTo(target);
  } else {
    state.skipDebounceTimer = setTimeout(() => {
      state.skipDebounceTimer = null;
      const finalTarget = state.pendingSeekTarget;
      state.pendingSeekTarget = null;
      if (typeof finalTarget === 'number' && Number.isFinite(finalTarget)) {
        state.seekTo(finalTarget);
      }
    }, 160);
  }
}

  const isFs = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
  document.querySelectorAll('.fs-toggle-btn').forEach(btn => {
    btn.innerHTML = `<svg data-lucide="${isFs ? 'minimize' : 'maximize'}" width="14" height="14"></svg>`;
    btn.title = isFs ? 'Exit Fullscreen (F)' : 'Fullscreen (F)';
  });
  lucide.createIcons();
  const stage = document.getElementById('video-stage-container');
  if (stage && stage._wakeHud) stage._wakeHud();
}

document.addEventListener('keydown', (e) => {
  if (!_activeMediaState) return;
  const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
  if (tag === 'input' && e.target.type !== 'range') return;
  if (tag === 'textarea' || tag === 'select' || e.target?.isContentEditable) return;

  if (e.key === 'ArrowLeft') {
    e.preventDefault();
    skipMediaBy(e.shiftKey ? -30 : -10);
  } else if (e.key === 'ArrowRight') {
    e.preventDefault();
    skipMediaBy(e.shiftKey ? 30 : 10);
  } else if (e.key === 'j' || e.key === 'J') {
    e.preventDefault();
    skipMediaBy(-30);
  } else if (e.key === 'l' || e.key === 'L') {
    e.preventDefault();
    skipMediaBy(30);
  } else if ((e.key === ' ' || e.key === 'k' || e.key === 'K') && tag !== 'button') {
    e.preventDefault();
    toggleMediaPlayPause();
  } else if ((e.key === 'f' || e.key === 'F') && _activeMediaState.isVid) {
    e.preventDefault();
    toggleVideoFullscreen();
  } else if (e.key === 'm' || e.key === 'M') {
    e.preventDefault();
    toggleMediaMute();
  }
});

function fmtMediaTime(sec) {
  if (!Number.isFinite(sec) || sec < 0) sec = 0;
  const total = Math.floor(sec);
  const hrs = Math.floor(total / 3600);
  const mins = Math.floor((total % 3600) / 60);
  const secs = total % 60;
  if (hrs > 0) {
    return `${hrs}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
  }
  return `${mins}:${String(secs).padStart(2, '0')}`;
}
