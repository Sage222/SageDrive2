    +     '<select id="media-subtitle-track-select" class="form-input" style="display:none;width:auto;padding:2px 8px;font-size:var(--text-xs);height:26px" onchange="changeMediaSubtitleTrack(this.value)" title="Embedded Subtitles (CC)"></select>'
    +     (isVid
            ? '<span style="font-size:var(--text-xs);color:var(--color-text-muted)">Zoom</span>'
              + '<div class="zoom-group">' + zoomBtns + '</div>'
            : '')
    +     '<span style="font-size:var(--text-xs);color:var(--color-text-muted)">Speed</span>'
    +     '<div class="speed-group">' + speedBtns + '</div>'
    +   '</div>'
    + '</div>'
    + '<div style="display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);flex-wrap:wrap">'
    +   '<div style="display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap">'
    +     '<span style="font-size:var(--text-xs);color:var(--color-text-muted);font-family:var(--font-mono)">' + fmtSize(f.size) + '</span>'
    +     '<span id="media-codec-badge" class="badge badge-primary" style="font-family:var(--font-mono);font-size:11px">' + escHtml(extBadge) + '</span>'
    +   '</div>'
    +   '<div style="display:flex;align-items:center;gap:var(--space-2)">'
    +     '<button id="media-compat-btn" class="btn btn-secondary btn-sm" onclick="forceMediaCompatMode()" title="Convert unsupported audio (EAC3/AC3/DTS) to stereo AAC">'
    +       '<svg data-lucide="volume-2" width="14" height="14"></svg> <span id="media-compat-label">AAC Audio Fix</span>'
    +     '</button>'
    +     '<button class="btn btn-secondary btn-sm" '
    +       'onclick="dlFile(\'' + fjEsc + '\',\'' + type + '\')">'
    +       '<svg data-lucide="download" width="14" height="14"></svg> Download'
    +     '</button>'
    +   '</div>'
    + '</div></div>',
    styleW
  );
  lucide.createIcons();

  const player = document.getElementById('active-media-player');
  const stageContainer = document.getElementById('video-stage-container');
  const statusWrap = document.getElementById('media-stream-status');
  const statusText = document.getElementById('media-stream-text');
  const statusPct = document.getElementById('media-stream-pct');
  const statusFill = document.getElementById('media-stream-fill');
  const codecBadge = document.getElementById('media-codec-badge');
  const compatBtn = document.getElementById('media-compat-btn');
  const compatLabel = document.getElementById('media-compat-label');
  const trackSelect = document.getElementById('media-audio-track-select');
  const hudTrackSelect = document.getElementById('hud-audio-track-select');
  const subSelect = document.getElementById('media-subtitle-track-select');
  const hudSubSelect = document.getElementById('hud-subtitle-track-select');
  const timelineBar = document.getElementById('media-timeline-bar');
  const timelineSlider = document.getElementById('media-timeline-slider');
  const stageSlider = document.getElementById('stage-timeline-slider');
  const timeCurrentEl = document.getElementById('media-time-current');
  const stageTimeCurrentEl = document.getElementById('stage-time-current');
  const timeTotalEl = document.getElementById('media-time-total');
  const stageTimeTotalEl = document.getElementById('stage-time-total');

  if (!player) return;

  if (_btAudioDelayEnabled) {
    applyBtAudioDelayToPlayer(player);
  }

  if (stageContainer) {
    let lastMouseX = -1;
    let lastMouseY = -1;
    const wakeHud = () => {
      stageContainer.classList.remove('hud-hidden');
      if (_hudIdleTimer) clearTimeout(_hudIdleTimer);
      _hudIdleTimer = setTimeout(() => {
        if (!stageContainer) return;
        if (_activeMediaState?.isScrubbing) {
          wakeHud();
          return;
        }
        const isFs = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
        if (isFs || (player && !player.paused)) {
          stageContainer.classList.add('hud-hidden');
        }
      }, 5000);
    };
    stageContainer._wakeHud = wakeHud;
    stageContainer.addEventListener('mousemove', (e) => {
      if (Math.abs(e.clientX - lastMouseX) < 2 && Math.abs(e.clientY - lastMouseY) < 2) {
        return;
      }
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
      wakeHud();
    });
    stageContainer.addEventListener('mousedown', wakeHud);
    stageContainer.addEventListener('click', wakeHud);
    stageContainer.addEventListener('touchstart', wakeHud, { passive: true });
    stageContainer.addEventListener('mouseleave', () => {
      const isFs = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
      if (player && !player.paused && !_activeMediaState?.isScrubbing && !isFs) {
        stageContainer.classList.add('hud-hidden');
      }
    });
    wakeHud();
  }

  const state = {
    f,
    type,
    src,
    isVid,
    mode: 'direct',
    audioTrack: 0,
    subtitleTrack: -1,
    subReqId: 0,
    canRemux: true,
    probeInfo: null,
    totalDuration: 0,
    seekOffset: 0,
    awaitingMetadata: false,
    pendingSeekTarget: null,
    skipDebounceTimer: null,
    isScrubbing: false,
    ignoreNextSeeking: false,
    triedFallback: false,
    silentCheckDone: false,
    switchMode: null,
    seekTo: null,
    refreshSubtitles: null,
  };
  _activeMediaState = state;

  async function refreshSubtitles() {
    if (_activeMediaState !== state || !player || !isVid) return;
    const reqId = ++state.subReqId;
    try {
      player.querySelectorAll('track').forEach(t => t.remove());
      if (player.textTracks) {
        for (let i = 0; i < player.textTracks.length; i++) {
          player.textTracks[i].mode = 'disabled';
        }
      }
    } catch (_) {}
    if (_activeSubBlobUrl) {
      try { URL.revokeObjectURL(_activeSubBlobUrl); } catch (_) {}
      _activeSubBlobUrl = null;
    }
    if (state.subtitleTrack < 0) return;

    const subUrl = mediaSubtitleUrl(state.f, state.type, state.subtitleTrack, state.seekOffset || 0);
    try {
      const r = await apiFetch(subUrl);
      if (!r.ok || _activeMediaState !== state || state.subReqId !== reqId) return;
      const vttText = await r.text();
      if (_activeMediaState !== state || state.subReqId !== reqId) return;
      const blob = new Blob([vttText], { type: 'text/vtt' });
      _activeSubBlobUrl = URL.createObjectURL(blob);
      const trackEl = document.createElement('track');
      trackEl.kind = 'subtitles';
      trackEl.label = 'Subtitles';
      trackEl.srclang = 'en';
      trackEl.src = _activeSubBlobUrl;
      trackEl.default = true;
      player.appendChild(trackEl);
      const enableTrack = () => {
        try {
          if (player.textTracks && player.textTracks.length > 0) {
            player.textTracks[player.textTracks.length - 1].mode = 'showing';
          }
        } catch (_) {}
      };
      trackEl.addEventListener('load', enableTrack);
      setTimeout(enableTrack, 50);
    } catch (_) {}
  }
  state.refreshSubtitles = refreshSubtitles;

  function syncTimelineUi() {
    const probeDur = (state.probeInfo && state.probeInfo.duration > 0) ? state.probeInfo.duration : 0;
    const rawPlayerDur = (!state.awaitingMetadata && player && Number.isFinite(player.duration) && player.duration > 0 && player.duration < 86400 * 7)
      ? player.duration
      : 0;

    let effTotal = state.totalDuration || 0;
    if (probeDur > 0) {
      if (state.mode === 'direct' && state.seekOffset === 0 && rawPlayerDur > 10 && rawPlayerDur < probeDur - 5) {
        effTotal = rawPlayerDur;
      } else {
        effTotal = probeDur;
      }
    } else if (state.mode === 'direct' && state.seekOffset === 0 && rawPlayerDur > 0) {
      effTotal = rawPlayerDur;
    } else if (effTotal <= 0 && state.seekOffset === 0 && rawPlayerDur > 0) {
      effTotal = rawPlayerDur;
    }

    if (effTotal > 0) {
      state.totalDuration = effTotal;
      if (timelineBar) timelineBar.style.display = 'flex';
      const maxStr = String(Math.ceil(effTotal * 10) / 10);
      const totFmt = fmtMediaTime(effTotal);
      if (timelineSlider) timelineSlider.max = maxStr;
      if (stageSlider) stageSlider.max = maxStr;
      if (timeTotalEl) timeTotalEl.textContent = totFmt;
      if (stageTimeTotalEl) stageTimeTotalEl.textContent = totFmt;
    }
    if (!state.isScrubbing && state.pendingSeekTarget === null) {
      const relTime = (!state.awaitingMetadata && player && Number.isFinite(player.currentTime))
        ? player.currentTime
        : 0;
      const curPos = Math.min(
        effTotal || Infinity,
        Math.max(0, state.seekOffset + relTime)
      );
      const valStr = String(Math.round(curPos * 10) / 10);
      const curFmt = fmtMediaTime(curPos);
      if (timelineSlider) timelineSlider.value = valStr;
      if (stageSlider) stageSlider.value = valStr;
      if (timeCurrentEl) timeCurrentEl.textContent = curFmt;
      if (stageTimeCurrentEl) stageTimeCurrentEl.textContent = curFmt;
    }
  }

  function updateCodecUi() {
    if (!codecBadge) return;
    const p = state.probeInfo;
    const ac = p && p.audio_codec ? p.audio_codec.toUpperCase() : '';
    const vc = p && p.video_codec ? p.video_codec.toUpperCase() : extBadge;
    const ch = p && p.audio_channels > 2 ? ` ${p.audio_channels}ch` : '';
    const durBadge = state.totalDuration > 0 ? ` • ${fmtMediaTime(state.totalDuration)}` : '';
    if (state.mode === 'remux') {
      codecBadge.textContent = `${vc} • ${ac || 'Audio'}${ch} → AAC Stereo${durBadge}`;
      if (compatBtn) compatBtn.classList.add('btn-primary');
      if (compatBtn) compatBtn.classList.remove('btn-secondary');
      if (compatLabel) compatLabel.textContent = 'AAC Stereo Active';
    } else if (state.mode === 'full') {
      codecBadge.textContent = `${vc}${ac ? ' + ' + ac : ''} → H264 + AAC${durBadge}`;
      if (compatBtn) compatBtn.classList.add('btn-primary');
      if (compatBtn) compatBtn.classList.remove('btn-secondary');
      if (compatLabel) compatLabel.textContent = 'Full Transcode Active';
    } else if (state.mode === 'audio') {
      codecBadge.textContent = `${ac || extBadge}${ch} → MP3 Stereo${durBadge}`;
      if (compatBtn) compatBtn.classList.add('btn-primary');
      if (compatBtn) compatBtn.classList.remove('btn-secondary');
      if (compatLabel) compatLabel.textContent = 'Compat Audio Active';
    } else {
      codecBadge.textContent = (ac ? `${vc} • ${ac}${ch}` : vc) + durBadge;
      if (compatBtn) compatBtn.classList.remove('btn-primary');
      if (compatBtn) compatBtn.classList.add('btn-secondary');
      if (compatLabel) compatLabel.textContent = 'AAC Audio Fix';
    }
  }

  function switchMode(newMode, isManual, seekSeconds) {
    if (_activeMediaState !== state) return;
    state.mode = newMode;
    const startSec = (typeof seekSeconds === 'number' && Number.isFinite(seekSeconds) && seekSeconds >= 0)
      ? seekSeconds
      : 0;
    state.awaitingMetadata = true;
    state.seekOffset = (newMode === 'direct') ? 0 : startSec;
    updateCodecUi();
    syncTimelineUi();

    if (statusWrap) {
      statusWrap.style.display = 'flex';
      statusFill.classList.add('indeterminate');
      const seekLabel = state.seekOffset > 0 ? ` at ${fmtMediaTime(state.seekOffset)}` : '';
      if (newMode === 'remux') {
        const acName = (state.probeInfo && state.probeInfo.audio_codec) ? state.probeInfo.audio_codec.toUpperCase() : 'audio';
        statusText.textContent = `Streaming ${acName} → AAC${seekLabel}…`;
      } else if (newMode === 'full') {
        statusText.textContent = `Transcoding video & audio${seekLabel}…`;
      } else if (newMode === 'audio') {
        statusText.textContent = `Transcoding audio stream${seekLabel}…`;
      } else {
        statusText.textContent = 'Connecting to media stream…';
      }
    }

    let targetUrl = src;
    const authDur = (state.probeInfo && state.probeInfo.duration > 0) ? state.probeInfo.duration : state.totalDuration;
    const durParam = authDur > 0 ? `&duration=${encodeURIComponent(authDur.toFixed(2))}` : '';
    const ssParam = state.seekOffset > 0 ? `&ss=${encodeURIComponent(state.seekOffset.toFixed(2))}` : '';
    const cacheBust = `&_t=${Date.now()}`;
    if (newMode === 'remux') {
      targetUrl = `${src}&transcode=1&mode=remux&audio_track=${state.audioTrack}${durParam}${ssParam}${cacheBust}`;
    } else if (newMode === 'full') {
      targetUrl = `${src}&transcode=1&mode=full&audio_track=${state.audioTrack}${durParam}${ssParam}${cacheBust}`;
    } else if (newMode === 'audio') {
      targetUrl = `${src}&transcode=audio${durParam}${ssParam}${cacheBust}`;
    }

    state.ignoreNextSeeking = true;
    player.src = targetUrl;
    player.load();
    player.playbackRate = _playbackRate;
    if (newMode === 'direct' && startSec > 0) {
      const setDirectTime = () => {
        player.removeEventListener('loadedmetadata', setDirectTime);
        try { player.currentTime = startSec; } catch (_) {}
      };
      player.addEventListener('loadedmetadata', setDirectTime);
    }
    if (isVid && state.subtitleTrack >= 0) {
      refreshSubtitles();
    }
    player.play().catch(() => {});
  }
  state.switchMode = switchMode;

  function seekTo(targetSec) {
    if (_activeMediaState !== state) return;
    if (state.skipDebounceTimer) {
      clearTimeout(state.skipDebounceTimer);
      state.skipDebounceTimer = null;
    }
    state.pendingSeekTarget = null;

    const clamped = state.totalDuration > 0
      ? Math.max(0, Math.min(state.totalDuration - 0.5, targetSec))
      : Math.max(0, targetSec);

    if (_activeMediaBlobUrl) {
      state.seekOffset = 0;
      state.ignoreNextSeeking = true;
      try { player.currentTime = clamped; } catch (_) {}
      syncTimelineUi();
      return;
    }

    if (state.mode === 'direct') {
      let canNativeSeek = false;
      try {
        if (player.seekable && player.seekable.length > 0) {
          const seekEnd = player.seekable.end(player.seekable.length - 1);
          if (clamped <= seekEnd + 1) canNativeSeek = true;
        }
      } catch (_) {}

      if (canNativeSeek) {
        state.seekOffset = 0;
        state.ignoreNextSeeking = true;
        try { player.currentTime = clamped; } catch (_) {}
        syncTimelineUi();
        return;
      }
      const fallbackMode = state.isVid ? (state.canRemux ? 'remux' : 'full') : 'audio';
      switchMode(fallbackMode, true, clamped);
      return;
    }

    switchMode(state.mode, true, clamped);
  }
  state.seekTo = seekTo;

  player.playbackRate = _playbackRate;
  player.onplay = () => {
    if (_btAudioDelayEnabled) applyBtAudioDelayToPlayer(player);
    updatePlayPauseIcons();
    if (stageContainer && stageContainer._wakeHud) stageContainer._wakeHud();
  };
  player.onpause = () => {
    updatePlayPauseIcons();
    if (stageContainer) stageContainer.classList.remove('hud-hidden');
  };
  player.onloadedmetadata = () => {
    state.awaitingMetadata = false;
    player.playbackRate = _playbackRate;
    syncTimelineUi();
    updateCodecUi();
  };
  player.ondurationchange = () => {
    syncTimelineUi();
    updateCodecUi();
  };
  player.onloadeddata = () => {
    state.awaitingMetadata = false;
    player.playbackRate = _playbackRate;
    state.ignoreNextSeeking = false;
    if (statusWrap) statusWrap.style.display = 'none';
    syncTimelineUi();
    updatePlayPauseIcons();
  };
  player.oncanplay = () => {
    state.awaitingMetadata = false;
    player.playbackRate = _playbackRate;
    state.ignoreNextSeeking = false;
    if (statusWrap) statusWrap.style.display = 'none';
    syncTimelineUi();
    updatePlayPauseIcons();
  };
  player.onwaiting = () => {
    if (statusWrap && !_activeMediaBlobUrl) {
      statusWrap.style.display = 'flex';
      statusText.textContent = 'Buffering…';
      statusFill.classList.add('indeterminate');
    }
  };
  player.onplaying = () => {
    state.awaitingMetadata = false;
    state.ignoreNextSeeking = false;
    if (_btAudioDelayEnabled) applyBtAudioDelayToPlayer(player);
    if (statusWrap) statusWrap.style.display = 'none';
    syncTimelineUi();
    updatePlayPauseIcons();
    if (stageContainer && stageContainer._wakeHud) stageContainer._wakeHud();
  };
  player.onended = () => {
    updatePlayPauseIcons();
    const relPlayed = (!state.awaitingMetadata && player && Number.isFinite(player.currentTime)) ? player.currentTime : 0;
    const absPos = state.seekOffset + relPlayed;
    if (state.mode !== 'direct' && relPlayed < 1.0 && state.seekOffset > 5) {
      const safeEnd = Math.max(1, state.seekOffset - 2);
      state.totalDuration = safeEnd;
      if (state.probeInfo) state.probeInfo.duration = safeEnd;
      syncTimelineUi();
      updateCodecUi();
      return;
    }
    if (absPos > 5 && state.totalDuration > absPos + 2) {
      state.totalDuration = absPos;
      if (state.probeInfo) state.probeInfo.duration = absPos;
      syncTimelineUi();
      updateCodecUi();
    }
    if (_autoPlayNext && _mediaPlaylist.length > 1) {
      nextMediaTrack(type);
    }
  };

  player.ontimeupdate = () => {
    if (_activeMediaState !== state) return;
    syncTimelineUi();

    if (!isVid || state.mode !== 'direct' || state.silentCheckDone) return;
    if (player.currentTime < 1.5) return;
    state.silentCheckDone = true;

    if (state.probeInfo && state.probeInfo.has_audio && !state.probeInfo.needs_audio_transcode && state.probeInfo.audio_codec) {
      return;
    }

    const expectAudio = !state.probeInfo || state.probeInfo.has_audio !== false;
    if (!expectAudio) return;

    const noAudioTracks = Boolean(player.audioTracks && player.audioTracks.length === 0);
    const mozNoAudio = player.mozHasAudio === false;
    const webkitZeroAudio = (
      typeof player.webkitAudioDecodedByteCount === 'number' &&
      player.webkitAudioDecodedByteCount === 0 &&
      (typeof player.webkitVideoDecodedByteCount !== 'number' || player.webkitVideoDecodedByteCount > 0)
    );

    if (noAudioTracks || mozNoAudio || webkitZeroAudio) {
      switchMode(state.canRemux ? 'remux' : 'full', false, player.currentTime || 0);
    }
  };

  player.onerror = () => {
    if (_activeMediaState !== state) return;
    if (isVid) {
      if (state.mode === 'direct') {
        switchMode(state.canRemux ? 'remux' : 'full', false, state.seekOffset);
        return;
      }
      if (state.mode === 'remux') {
        switchMode('full', false, state.seekOffset);
        return;
      }
    } else {
      if (state.mode === 'direct') {
        switchMode('audio', false, state.seekOffset);
        return;
      }
    }
    if (!state.triedFallback) {
      state.triedFallback = true;
      fallbackStreamMedia(src, f, player, statusWrap, statusText, statusPct, statusFill, true);
    }
  };

  (async () => {
    const ext = _fileExt(f);
    let probe = null;
    try {
      const probeCtrl = new AbortController();
      const timer = setTimeout(() => probeCtrl.abort(), 12000);
      const r = await apiFetch(mediaProbeUrl(f, type), { signal: probeCtrl.signal });
      clearTimeout(timer);
      if (r.ok) {
        probe = await r.json();
      }
    } catch (_) {}

    if (_activeMediaState !== state) return;
    state.probeInfo = probe;
    if (probe && probe.duration > 0) {
      state.totalDuration = probe.duration;
      syncTimelineUi();
    }

    if (probe && Array.isArray(probe.audio_streams) && probe.audio_streams.length > 0) {
      const audioOptionsHtml = probe.audio_streams.map((t, i) => {
        const lang = t.language ? t.language.toUpperCase() : `Track ${i + 1}`;
        const codec = (t.codec || '').toUpperCase();
        const ch = t.channels ? `${t.channels}ch` : '';
        const title = t.title ? ` (${t.title})` : '';
        return `<option value="${i}">${escHtml(`Audio: ${lang} • ${codec} ${ch}${title}`.trim())}</option>`;
      }).join('');
      if (trackSelect && probe.audio_streams.length > 1) {
        trackSelect.innerHTML = audioOptionsHtml;
        trackSelect.style.display = 'inline-block';
      }
      if (hudTrackSelect && probe.audio_streams.length > 1) {
        hudTrackSelect.innerHTML = audioOptionsHtml;
        hudTrackSelect.style.display = 'inline-block';
      }
    }

    if (isVid && probe && Array.isArray(probe.subtitle_streams) && probe.subtitle_streams.length > 0) {
      const defaultSubIdx = probe.subtitle_streams.findIndex(s => s.forced || s.default);
      if (defaultSubIdx >= 0) {
        state.subtitleTrack = defaultSubIdx;
      }
      const subOptionsHtml = `<option value="-1" ${state.subtitleTrack === -1 ? 'selected' : ''}>CC: Off</option>`
        + probe.subtitle_streams.map((s, i) => {
          const lang = s.language ? s.language.toUpperCase() : `Track ${i + 1}`;
          const title = s.title ? ` (${s.title})` : '';
          const flags = s.forced ? ' [Forced]' : (s.default ? ' [Default]' : '');
          const selAttr = state.subtitleTrack === i ? 'selected' : '';
          return `<option value="${i}" ${selAttr}>${escHtml(`CC: ${lang}${title}${flags}`.trim())}</option>`;
        }).join('');
      if (subSelect) {
        subSelect.innerHTML = subOptionsHtml;
        subSelect.style.display = 'inline-block';
      }
      if (hudSubSelect) {
        hudSubSelect.innerHTML = subOptionsHtml;
        hudSubSelect.style.display = 'inline-block';
      }
    }

    if (isVid) {
      const canPlayHevc = Boolean(
        player.canPlayType('video/mp4; codecs="hvc1.1.6.L93.B0"') ||
        player.canPlayType('video/mp4; codecs="hev1.1.6.L93.B0"')
      );
      if (probe && probe.video_codec) {
        const vcodec = probe.video_codec.toLowerCase();
        const isHevcUnsupported = vcodec === 'hevc' && !canPlayHevc;
        state.canRemux = Boolean(probe.can_remux_video && !isHevcUnsupported);

        if (probe.needs_video_transcode || isHevcUnsupported) {
          switchMode('full', false, 0);
          return;
        }
        if (probe.needs_audio_transcode || probe.recommended_mode === 'remux' || ext === 'mkv') {
          switchMode(state.canRemux ? 'remux' : 'full', false, 0);
          return;
        }
        if (probe.recommended_mode === 'full') {
          switchMode('full', false, 0);
          return;
        }
      } else if (['mkv', 'avi', 'wmv', 'flv', 'ts', 'm2ts', 'mpg', 'mpeg', 'vob', 'divx'].includes(ext)) {
        switchMode('full', false, 0);
        return;
      }
      switchMode('direct', false, 0);
    } else {
      if (
        (probe && (probe.needs_audio_transcode || probe.recommended_mode === 'audio')) ||
        ['eac3', 'ec3', 'ac3', 'dts', 'wma', 'aiff', 'aif', 'alac', 'mka', 'mp2'].includes(ext)
      ) {
        switchMode('audio', false, 0);
        return;
      }
      switchMode('direct', false, 0);
    }
  })();
}

// ── In-Browser Image Lightbox Viewer ──────────────────────────────────────────
let _imagePlaylist = [];
let _imageIndex = -1;
let _imageZoom = 1;

function adjustImageZoom(delta, reset = false) {
  if (reset) _imageZoom = 1;
  else _imageZoom = Math.max(0.25, Math.min(4, Math.round((_imageZoom + delta) * 100) / 100));
  const img = document.getElementById('active-image-preview');
  const lbl = document.getElementById('image-zoom-label');
  if (img) img.style.transform = `scale(${_imageZoom})`;
  if (lbl) lbl.textContent = Math.round(_imageZoom * 100) + '%';
}

function prevImage(type) {
  if (_imagePlaylist.length <= 1) return;
  const idx = (_imageIndex - 1 + _imagePlaylist.length) % _imagePlaylist.length;
  openImageViewer(encodeFileArg(_imagePlaylist[idx]), type);
}

function nextImage(type) {
  if (_imagePlaylist.length <= 1) return;
  const idx = (_imageIndex + 1) % _imagePlaylist.length;
  openImageViewer(encodeFileArg(_imagePlaylist[idx]), type);
}

async function fallbackLoadImage(src, imgEl) {
  try {
    const r = await apiFetch(src);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const blob = await r.blob();
    if (_activeMediaBlobUrl) {
      try { URL.revokeObjectURL(_activeMediaBlobUrl); } catch (_) {}
    }
    _activeMediaBlobUrl = URL.createObjectURL(blob);
    imgEl.onerror = () => {
      const sp = document.getElementById('img-loading-spinner');
      if (sp) sp.outerHTML = '<span style="color:var(--color-error);font-size:var(--text-sm)">Unable to preview image</span>';
    };
    imgEl.src = _activeMediaBlobUrl;
  } catch (_) {
    const sp = document.getElementById('img-loading-spinner');
    if (sp) sp.outerHTML = '<span style="color:var(--color-error);font-size:var(--text-sm)">Unable to preview image</span>';
  }
}

// ── In-Browser Document / Text & Config Editor / Generic Preview Modal ────────
let _editorState = {
  file: null,
  type: '',
  originalContent: '',
  isEditing: false,
  wordWrap: true,
  dirty: false,
};

function updateEditorStats() {
  const ta = document.getElementById('text-editor-area');
  const pre = document.getElementById('text-preview-box');
  const statsEl = document.getElementById('text-editor-stats');
  const badgeEl = document.getElementById('text-editor-dirty-badge');
  const saveBtn = document.getElementById('text-editor-save-btn');
  const currentText = _editorState.isEditing && ta ? ta.value : (_editorState.originalContent || '');
  const lines = currentText ? currentText.split('\n').length : 1;
  const chars = currentText.length;
  _editorState.dirty = _editorState.isEditing && ta ? (ta.value !== _editorState.originalContent) : false;

  if (statsEl) {
    statsEl.textContent = `${lines} line${lines === 1 ? '' : 's'} • ${chars.toLocaleString()} chars`;
  }
  if (badgeEl) {
    if (_editorState.dirty) {
      badgeEl.style.display = 'inline-flex';
      badgeEl.className = 'badge badge-warning';
      badgeEl.textContent = 'Unsaved changes';
    } else if (_editorState.isEditing) {
      badgeEl.style.display = 'inline-flex';
      badgeEl.className = 'badge badge-success';
      badgeEl.textContent = 'Editing';
    } else {
      badgeEl.style.display = 'none';
    }
  }
  if (saveBtn) {
    saveBtn.style.display = _editorState.isEditing ? 'inline-flex' : 'none';
  }
  if (pre && !_editorState.isEditing) {
    pre.textContent = _editorState.originalContent;
  }
}

function toggleTextEditorMode(forceEdit = null) {
  if (!_adminMode) {
    requireAdminFrontend('edit files');
    return;
  }
  const ta = document.getElementById('text-editor-area');
  const pre = document.getElementById('text-preview-box');
  const toggleBtn = document.getElementById('text-editor-mode-btn');
  if (!ta || !pre) return;

  const nextEdit = forceEdit !== null ? Boolean(forceEdit) : !_editorState.isEditing;
  if (!nextEdit && _editorState.dirty) {
    if (!confirm('Discard unsaved changes and switch to read-only preview?')) return;
    ta.value = _editorState.originalContent;
  }
  _editorState.isEditing = nextEdit;
  pre.style.display = nextEdit ? 'none' : 'block';
  ta.style.display = nextEdit ? 'block' : 'none';
  if (toggleBtn) {
    toggleBtn.innerHTML = nextEdit
      ? `<svg data-lucide="eye" width="14" height="14"></svg> Preview`
      : `<svg data-lucide="edit-3" width="14" height="14"></svg> Edit File`;
  }
  updateEditorStats();
  lucide.createIcons();
  if (nextEdit) {
    setTimeout(() => ta.focus(), 30);
  }
}

function toggleEditorWordWrap() {
  _editorState.wordWrap = !_editorState.wordWrap;
  const ta = document.getElementById('text-editor-area');
  const pre = document.getElementById('text-preview-box');
  const btn = document.getElementById('text-editor-wrap-btn');
  const ws = _editorState.wordWrap ? 'pre-wrap' : 'pre';
  if (ta) ta.style.whiteSpace = ws;
  if (pre) pre.style.whiteSpace = ws;
  if (btn) btn.classList.toggle('active', _editorState.wordWrap);
}

function handleEditorKeydown(e, fJson, type) {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
    e.preventDefault();
    saveEditedTextFile(fJson, type);
    return;
  }
  if (e.key === 'Tab') {
    e.preventDefault();
    const ta = e.target;
    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    ta.value = ta.value.substring(0, start) + '  ' + ta.value.substring(end);
    ta.selectionStart = ta.selectionEnd = start + 2;
    updateEditorStats();
  }
}

async function saveEditedTextFile(fJson, type) {
  if (!requireAdminFrontend('save file changes')) return;
  const f = parseFileArg(fJson);
  const ta = document.getElementById('text-editor-area');
  const saveBtn = document.getElementById('text-editor-save-btn');
  if (!ta) return;
  const newContent = ta.value;

  if (saveBtn) {
    saveBtn.disabled = true;
    saveBtn.innerHTML = `<svg data-lucide="loader" width="14" height="14"></svg> Saving…`;
    lucide.createIcons();
  }
  try {
    let res;
    if (type === 'smb') {
      const targetPath = f.path || (_path.replace(/\/$/, '') + '/' + f.name);
      res = await apiJSON(`/api/smb/content/${encodeURIComponent(_activeDrive.id)}`, {
        method: 'PUT',
        json: { path: targetPath, content: newContent }
      });
    } else if (type === 'onedrive') {
      const accId = _activeDrive?.id || 'default';
      res = await apiJSON(`/api/onedrive/content/${encodeURIComponent(f.id)}?account_id=${encodeURIComponent(accId)}`, {
        method: 'PUT',
        json: { content: newContent, account_id: accId }
      });
    } else {
      const accId = _activeDrive?.id || 'default';
      res = await apiJSON(`/api/gdrive/content/${encodeURIComponent(f.id)}?account_id=${encodeURIComponent(accId)}`, {
        method: 'PUT',
        json: { content: newContent, account_id: accId }
      });
    }
    _editorState.originalContent = newContent;
    const pre = document.getElementById('text-preview-box');
    if (pre) pre.textContent = newContent;
    updateEditorStats();
    toast(`Saved "${f.name}" (${fmtSize(res.size ?? new Blob([newContent]).size)})`, 'success');
    if (_view === 'files') {
      reloadActiveDriveFiles();
    }
  } catch (e) {
    toast('Failed saving file: ' + e.message, 'error');
  } finally {
    if (saveBtn) {
      saveBtn.disabled = false;
      saveBtn.innerHTML = `<svg data-lucide="save" width="14" height="14"></svg> Save Changes`;
      lucide.createIcons();
    }
  }
}

function fileClick(fJson, type, ev) {
  if (ev && (ev.shiftKey || ev.metaKey || ev.ctrlKey)) {
    toggleSelectItem(fJson, type, ev);
    return;
  }
  const f = parseFileArg(fJson);
  if (f.type !== 'folder') {
    if (isVideoFile(f) || isAudioFile(f)) { openMedia(fJson, type); return; }
    if (isImageFile(f)) { openImageViewer(fJson, type); return; }
    openBrowserPreview(fJson, type);
    return;
  }
  if (type==='smb') {
    _path = f.path || (_path.replace(/\/$/,'') + '/' + f.name);
    loadSMBFiles();
  } else if (type==='onedrive') {
    _pathStack.push({id:f.id, name:f.name});
    _folderId = f.id;
    loadOneDriveFiles();
  } else {
    _pathStack.push({id:f.id, name:f.name});
    _folderId = f.id;
    loadGDriveFiles();
  }
}

function dlFile(fJson, type) {
  const f = parseFileArg(fJson);
  const accId = _activeDrive?.id || 'default';
  if (f.type === 'folder') {
    if (type === 'smb') {
      authedDownload(
        `/api/smb/zip/${_activeDrive.id}`,
        `${f.name}.zip`,
        0,
        { method: 'POST', json: { paths: [f.path || f.name], name: `${f.name}.zip` } }
      );
    } else if (type === 'onedrive') {
      authedDownload(
        `/api/onedrive/zip?account_id=${encodeURIComponent(accId)}`,
        `${f.name}.zip`,
        0,
        { method: 'POST', json: { ids: [f.id], name: `${f.name}.zip`, account_id: accId } }
      );
    } else {
      authedDownload(
        `/api/gdrive/zip?account_id=${encodeURIComponent(accId)}`,
        `${f.name}.zip`,
        0,
        { method: 'POST', json: { ids: [f.id], name: `${f.name}.zip`, account_id: accId } }
      );
    }
    return;
  }
  if (type==='smb') {
    authedDownload(`/api/smb/download/${_activeDrive.id}?path=${encodeURIComponent(f.path)}&dl=1`, f.name, f.size);
  } else if (type==='onedrive') {
    authedDownload(`/api/onedrive/download/${encodeURIComponent(f.id)}?account_id=${encodeURIComponent(accId)}&dl=1`, f.name, f.size);
  } else {
    authedDownload(`/api/gdrive/download/${encodeURIComponent(f.id)}?account_id=${encodeURIComponent(accId)}&dl=1`, f.name, f.size);
  }
}

const _activeDownloads = new Map();

function cancelDownload(dlId) {
  const ctrl = _activeDownloads.get(dlId);
  if (ctrl) {
    ctrl.abort();
    _activeDownloads.delete(dlId);
  }
}

async function authedDownload(path, name, knownSize = 0, fetchOpts = {}) {
  const dlId = 'dl_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
  const ctrl = new AbortController();
  _activeDownloads.set(dlId, ctrl);

  const card = document.createElement('div');
  card.className = 'toast dl-toast';
  card.id = dlId;
  card.innerHTML = `
    <div class="dl-toast-top">
      <div class="dl-toast-title">
        <svg data-lucide="download" class="toast-icon" style="color:var(--color-primary)"></svg>
        <span title="${escHtml(name)}">${escHtml(name)}</span>
      </div>
      <button class="btn btn-ghost btn-icon btn-sm" id="${dlId}_cancel" onclick="cancelDownload('${dlId}')" title="Cancel download">
        <svg data-lucide="x" width="14" height="14"></svg>
      </button>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="${dlId}_fill" style="width:0%"></div>
    </div>
    <div class="dl-toast-meta">
      <span id="${dlId}_status">Starting download…</span>
      <span id="${dlId}_pct">0%</span>
    </div>
  `;
  document.getElementById('toasts').appendChild(card);
  lucide.createIcons();

  const fillEl = document.getElementById(`${dlId}_fill`);
  const statusEl = document.getElementById(`${dlId}_status`);
  const pctEl = document.getElementById(`${dlId}_pct`);
  const cancelBtn = document.getElementById(`${dlId}_cancel`);

  try {
    const startTime = performance.now();
    const r = await apiFetch(path, { ...fetchOpts, signal: ctrl.signal });
    if (!r.ok) {
      const err = await r.json().catch(() => ({ error: 'Download failed' }));
      throw new Error(err.error || 'Download failed');
    }

    const totalBytes = parseInt(r.headers.get('Content-Length') || '0', 10) || knownSize || 0;
    let blob;

    if (r.body && r.body.getReader) {
      if (!totalBytes) fillEl.classList.add('indeterminate');
      const reader = r.body.getReader();
      const chunks = [];
      let receivedBytes = 0;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        receivedBytes += value.byteLength;

        const elapsedSec = Math.max(0.05, (performance.now() - startTime) / 1000);
        const speedStr = fmtSize(Math.round(receivedBytes / elapsedSec)) + '/s';

        if (totalBytes > 0) {
          const pct = receivedBytes >= totalBytes ? 100 : Math.min(99, Math.floor((receivedBytes / totalBytes) * 100));
          fillEl.style.width = pct + '%';
          pctEl.textContent = pct + '%';
          statusEl.textContent = `${fmtSize(receivedBytes)} / ${fmtSize(totalBytes)} • ${speedStr}`;
          if (receivedBytes >= totalBytes) {
            try { reader.cancel(); } catch (_) {}
            break;
          }
        } else {
          pctEl.textContent = speedStr;
          statusEl.textContent = `${fmtSize(receivedBytes)} downloaded`;
        }
      }
      blob = new Blob(chunks, { type: 'application/octet-stream' });
    } else {
      fillEl.classList.add('indeterminate');
      statusEl.textContent = 'Downloading…';
      blob = await r.blob();
    }

    _activeDownloads.delete(dlId);
    fillEl.classList.remove('indeterminate');
    fillEl.classList.add('done');
    fillEl.style.width = '100%';
    pctEl.textContent = '100%';
    statusEl.textContent = `Complete • ${fmtSize(blob.size)}`;
    card.classList.add('success');

    const objUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = objUrl;
    a.download = name;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();

    // Provide a direct Save button on the completed card in case browser popup/activation rules suppressed auto-save after a long transfer
    if (cancelBtn) {
      cancelBtn.outerHTML = `<a href="${objUrl}" download="${escHtml(name)}" class="btn btn-primary btn-sm" style="text-decoration:none;padding:2px 8px;font-size:11px" onclick="setTimeout(()=>document.getElementById('${dlId}')?.remove(), 500)">Save</a>`;
    }

    setTimeout(() => {
      try { a.remove(); } catch (_) {}
    }, 2000);
    setTimeout(() => URL.revokeObjectURL(objUrl), 300000);
    setTimeout(() => card.remove(), 6000);
  } catch (e) {
    _activeDownloads.delete(dlId);
    if (e.name === 'AbortError') {
      fillEl.classList.remove('indeterminate');
      fillEl.classList.add('error');
      statusEl.textContent = 'Download cancelled';
      pctEl.textContent = '';
      setTimeout(() => card.remove(), 1500);
      return;
    }
    fillEl.classList.remove('indeterminate');
    fillEl.classList.add('error');
    fillEl.style.width = '100%';
    card.classList.add('error');
    statusEl.textContent = 'Failed: ' + e.message;
    pctEl.textContent = '';
    setTimeout(() => card.remove(), 4000);
  }
}

async function doSaveDriveCustomName(driveType, driveId) {
  const newName = (document.getElementById('drive-custom-name-input')?.value || '').trim();
  if (!newName) {
    toast('Please enter a custom display name', 'error');
    return;
  }
  try {
    if (driveType === 'smb') {
      await apiJSON(`/api/smb/shares/${encodeURIComponent(driveId)}/rename`, {
        method: 'POST',
        json: { name: newName }
      });
      await refreshShares();
      if (_activeDrive?.type === 'smb' && _activeDrive?.id === driveId) {
        _activeDrive.name = newName;
        if (_view === 'files') setBreadcrumb(smbBreadcrumbs());
      }
    } else if (driveType === 'onedrive') {
      await apiJSON(`/api/onedrive/accounts/${encodeURIComponent(driveId)}/rename`, {
        method: 'POST',
        json: { name: newName }
      });
      await refreshODStatus();
      if (_activeDrive?.type === 'onedrive' && _activeDrive?.id === driveId) {
        _activeDrive.name = newName;
        if (_pathStack.length > 0) _pathStack[0].name = newName;
        if (_view === 'files') setBreadcrumb(gDriveBreadcrumbs());
      }
    } else {
      await apiJSON(`/api/gdrive/accounts/${encodeURIComponent(driveId)}/rename`, {
        method: 'POST',
        json: { name: newName }
      });
      await refreshGDStatus();
      if (_activeDrive?.type === 'gdrive' && _activeDrive?.id === driveId) {
        _activeDrive.name = newName;
        if (_pathStack.length > 0) _pathStack[0].name = newName;
        if (_view === 'files') setBreadcrumb(gDriveBreadcrumbs());
      }
    }
    closeModal();
    renderSidebar();
    if (_view === 'settings') renderSettings();
    toast(`Renamed to "${newName}"`, 'success');
  } catch (e) {
    toast('Failed to rename: ' + e.message, 'error');
  }
}

async function doRename(fJson, type) {
  const f = parseFileArg(fJson);
  const newName = (document.getElementById('rename-input')?.value || '').trim();
  if (!newName || newName === f.name) {
    closeModal();
    return;
  }
  try {
    if (type === 'smb') {
      await apiJSON(`/api/smb/rename/${_activeDrive.id}`, {
        method: 'POST',
        json: { path: f.path || (_path.replace(/\/$/, '') + '/' + f.name), new_name: newName }
      });
      closeModal();
      toast(`Renamed to "${newName}"`, 'success');
      loadSMBFiles();
    } else if (type === 'onedrive') {
      const accId = _activeDrive?.id || 'default';
      await apiJSON(`/api/onedrive/rename/${encodeURIComponent(f.id)}?account_id=${encodeURIComponent(accId)}`, {
        method: 'POST',
        json: { name: newName, account_id: accId }
      });
      closeModal();
      toast(`Renamed to "${newName}"`, 'success');
      loadOneDriveFiles();
    } else {
      const accId = _activeDrive?.id || 'default';
      await apiJSON(`/api/gdrive/rename/${encodeURIComponent(f.id)}?account_id=${encodeURIComponent(accId)}`, {
        method: 'POST',
        json: { name: newName, account_id: accId }
      });
      closeModal();
      toast(`Renamed to "${newName}"`, 'success');
      loadGDriveFiles();
    }
  } catch (e) {
    toast('Rename failed: ' + e.message, 'error');
  }
}

// ── Multi-Select Batch Actions (ZIP Download, Delete, Copy Across Drives) ────
function downloadSelectedZip(type) {
  const items = Array.from(_selectedItems.values());
  if (!items.length) return;
  const archiveName = items.length === 1
    ? `${items[0].name}.zip`
    : `${_activeDrive.name.replace(/\s+/g, '_')}_${items.length}_items.zip`;

  if (type === 'smb') {
    const paths = items.map(it => it.path || (_path.replace(/\/$/, '') + '/' + it.name));
    authedDownload(`/api/smb/zip/${_activeDrive.id}`, archiveName, 0, {
      method: 'POST',
      json: { paths, name: archiveName }
    });
  } else if (type === 'onedrive') {
    const accId = _activeDrive?.id || 'default';
    const ids = items.map(it => it.id);
    authedDownload(`/api/onedrive/zip?account_id=${encodeURIComponent(accId)}`, archiveName, 0, {
      method: 'POST',
      json: { ids, name: archiveName, account_id: accId }
    });
  } else {
    const accId = _activeDrive?.id || 'default';
    const ids = items.map(it => it.id);
    authedDownload(`/api/gdrive/zip?account_id=${encodeURIComponent(accId)}`, archiveName, 0, {
      method: 'POST',
      json: { ids, name: archiveName, account_id: accId }
    });
  }
}

async function deleteSelectedItems(type) {
  if (!requireAdminFrontend('delete items')) return;
  const items = Array.from(_selectedItems.values());
  if (!items.length) return;
  if (!confirm(`Delete ${items.length} selected item${items.length > 1 ? 's' : ''}?`)) return;
  let deleted = 0;
  const accId = _activeDrive?.id || 'default';
  for (const f of items) {
    try {
      if (type === 'smb') {
        await apiJSON(`/api/smb/delete/${_activeDrive.id}`, {
          method: 'DELETE',
          json: { path: f.path || f.name, is_dir: f.type === 'folder' }
        });
      } else if (type === 'onedrive') {
        await apiJSON(`/api/onedrive/delete/${encodeURIComponent(f.id)}?account_id=${encodeURIComponent(accId)}`, { method: 'DELETE' });
      } else {
        await apiJSON(`/api/gdrive/delete/${encodeURIComponent(f.id)}?account_id=${encodeURIComponent(accId)}`, { method: 'DELETE' });
      }
      deleted++;
    } catch (e) {
      toast(`Failed deleting "${f.name}": ${e.message}`, 'error');
    }
  }
  clearSelection();
  if (deleted) toast(`Deleted ${deleted} item${deleted > 1 ? 's' : ''}`, 'success');
  reloadActiveDriveFiles();
}

// ── Cross-Drive / Same-Drive Copy & Move Modal ────────────────────────────────
let _transferItems = [];
let _transferSrcType = '';
let _transferMode = 'copy'; // 'copy' or 'move'
let _transferDestDrive = null;
let _transferDestFolder = '/';
let _transferDestStack = [];

function setTransferMode(mode) {
  _transferMode = mode === 'move' ? 'move' : 'copy';
  const isMove = _transferMode === 'move';
  const itemSummary = _transferItems.length === 1
    ? `"${_transferItems[0].name}"`
    : `${_transferItems.length} selected items`;

  const titleEl = document.getElementById('transfer-modal-title');
  if (titleEl) titleEl.textContent = `${isMove ? 'Move' : 'Copy'} ${itemSummary}`;

  const copyTab = document.getElementById('transfer-mode-copy');
  const moveTab = document.getElementById('transfer-mode-move');
  if (copyTab) copyTab.classList.toggle('active', !isMove);
  if (moveTab) moveTab.classList.toggle('active', isMove);

  const submitBtn = document.getElementById('transfer-submit-btn');
  if (submitBtn) {
    submitBtn.innerHTML = `<svg data-lucide="${isMove ? 'folder-output' : 'copy'}" width="14" height="14"></svg> ${isMove ? 'Move Here' : 'Copy Here'}`;
  }
  lucide.createIcons();
}

async function showTransferModal(srcType, singleItemJson = null, mode = 'copy') {
  if (!requireAdminFrontend(mode === 'move' ? 'move items' : 'copy items')) return;
  _transferSrcType = srcType;
  _transferMode = mode === 'move' ? 'move' : 'copy';
  _transferItems = singleItemJson
    ? [parseFileArg(singleItemJson)]
    : Array.from(_selectedItems.values());

  if (!_transferItems.length) {
    toast('Select at least one file or folder first', 'error');
    return;
  }

  await refreshShares();
  await refreshGDStatus();
  await refreshODStatus();

  const destOptions = [];
  for (const acc of _gdAccounts) {
    destOptions.push({ key: `gdrive:${acc.id}`, type: 'gdrive', id: acc.id, name: `Google Drive: ${acc.name}` });
  }
  for (const acc of _odAccounts) {
    destOptions.push({ key: `onedrive:${acc.id}`, type: 'onedrive', id: acc.id, name: `OneDrive: ${acc.name}` });
  }
  for (const s of _shares) {
    destOptions.push({ key: `smb:${s.id}`, type: 'smb', id: s.id, name: `SMB: ${s.name}` });
  }

  if (!destOptions.length) {
    toast('No destination drives configured', 'error');
    return;
  }

  const isMove = _transferMode === 'move';
  const sameDriveOpt = destOptions.find(d => d.type === srcType && d.id === _activeDrive.id);
  const diffDriveOpt = destOptions.find(d => d.type !== srcType || d.id !== _activeDrive.id);
  const preferred = isMove
    ? (sameDriveOpt || destOptions[0])
    : (diffDriveOpt || sameDriveOpt || destOptions[0]);

  _transferDestDrive = preferred;
  _transferDestFolder = preferred.type === 'smb' ? '/' : 'root';
  _transferDestStack = [{ id: _transferDestFolder, name: preferred.name }];

function onTransferDriveChange(val) {
  const idx = val.indexOf(':');
  const type = val.slice(0, idx);
  const id = val.slice(idx + 1);
  let label = id;
  if (type === 'gdrive') {
    label = _gdAccounts.find(a => a.id === id)?.name || 'Google Drive';
  } else if (type === 'onedrive') {
    label = _odAccounts.find(a => a.id === id)?.name || 'OneDrive';
  } else {
    label = _shares.find(s => s.id === id)?.name || id;
  }
  _transferDestDrive = { key: val, type, id, name: label };
  _transferDestFolder = type === 'smb' ? '/' : 'root';
  _transferDestStack = [{ id: _transferDestFolder, name: label }];
  loadTransferFolders();
}

async function loadTransferFolders() {
  const box = document.getElementById('transfer-folder-browser');
  const pathLabel = document.getElementById('transfer-cur-path');
  if (!box || !_transferDestDrive) return;

  if (_transferDestDrive.type === 'smb') {
    pathLabel.textContent = _transferDestFolder;
  } else {
    pathLabel.textContent = '/' + _transferDestStack.slice(1).map(s => s.name).join('/');
  }

  box.innerHTML = `<div style="padding:var(--space-4);text-align:center;color:var(--color-text-muted);font-size:var(--text-xs)">Loading folders…</div>`;
  try {
    let items = [];
    if (_transferDestDrive.type === 'smb') {
      items = await apiJSON(`/api/smb/browse/${_transferDestDrive.id}?path=${encodeURIComponent(_transferDestFolder)}`);
    } else if (_transferDestDrive.type === 'onedrive') {
      items = await apiJSON(`/api/onedrive/files?folder=${encodeURIComponent(_transferDestFolder)}&account_id=${encodeURIComponent(_transferDestDrive.id)}`);
    } else {
      items = await apiJSON(`/api/gdrive/files?folder=${encodeURIComponent(_transferDestFolder)}&account_id=${encodeURIComponent(_transferDestDrive.id)}`);
    }
    const isSameDrive = _transferDestDrive.type === _transferSrcType && _transferDestDrive.id === _activeDrive?.id;
    const movingFolderKeys = new Set(
      isSameDrive
        ? _transferItems.filter(it => it.type === 'folder').map(it => _transferDestDrive.type === 'smb' ? it.path : it.id)
        : []
    );
    const folders = items.filter(it => {
      if (it.type !== 'folder') return false;
      const k = _transferDestDrive.type === 'smb' ? it.path : it.id;
      return !movingFolderKeys.has(k);
    });
    let html = '';

    if ((_transferDestDrive.type === 'smb' && _transferDestFolder !== '/') ||
        (_transferDestDrive.type !== 'smb' && _transferDestStack.length > 1)) {
      html += `<div class="ctx-item" onclick="transferGoUp()">
        <svg data-lucide="corner-left-up"></svg> .. (Parent folder)
      </div>`;
    }

    if (!folders.length && !html) {
      html = `<div style="padding:var(--space-3);text-align:center;color:var(--color-text-faint);font-size:var(--text-xs)">No subfolders (will ${_transferMode === 'move' ? 'move' : 'copy'} into current folder)</div>`;
    } else {
      for (const fld of folders) {
        const targetId = _transferDestDrive.type === 'smb'
          ? (fld.path || (_transferDestFolder.replace(/\/$/, '') + '/' + fld.name))
          : fld.id;
        html += `<div class="ctx-item" onclick="transferEnterFolder('${escAttr(targetId)}','${escAttr(fld.name)}')">
          <svg data-lucide="folder" style="color:var(--color-gold,#d19900)"></svg>
          <span>${escHtml(fld.name)}</span>
        </div>`;
      }
    }
    box.innerHTML = html;
    lucide.createIcons();
  } catch (e) {
    box.innerHTML = `<div style="padding:var(--space-3);color:var(--color-error);font-size:var(--text-xs)">${escHtml(e.message)}</div>`;
  }
}

function transferEnterFolder(idOrPath, name) {
  _transferDestFolder = idOrPath;
  _transferDestStack.push({ id: idOrPath, name });
  loadTransferFolders();
}

function transferGoUp() {
  if (_transferDestDrive.type === 'smb') {
    const parts = _transferDestFolder.split('/').filter(Boolean);
    parts.pop();
    _transferDestFolder = '/' + parts.join('/');
  } else if (_transferDestStack.length > 1) {
    _transferDestStack.pop();
    _transferDestFolder = _transferDestStack[_transferDestStack.length - 1].id;
  }
  loadTransferFolders();
}

async function readEntryRecursively(entry, parentPath = '') {
  if (entry.isFile) {
    return new Promise((resolve) => {
      entry.file((file) => {
        const relPath = parentPath ? `${parentPath}/${file.name}` : file.name;
        resolve([{ file, relativePath: relPath }]);
      }, () => resolve([]));
    });
  }
  if (entry.isDirectory) {
    const dirReader = entry.createReader();
    const allEntries = [];
    while (true) {
      const batch = await new Promise((resolve) => dirReader.readEntries(resolve, () => resolve([])));
      if (!batch || batch.length === 0) break;
      allEntries.push(...batch);
    }
    const nextParent = parentPath ? `${parentPath}/${entry.name}` : entry.name;
    const nested = [];
    for (const child of allEntries) {
      const items = await readEntryRecursively(child, nextParent);
      nested.push(...items);
    }
    return nested;
  }
  return [];
}

async function dzDrop(e, type) {
  e.preventDefault();
  document.getElementById('dropzone')?.classList.remove('drag-over');
  const items = e.dataTransfer?.items;
  if (items && items.length && typeof items[0].webkitGetAsEntry === 'function') {
    const entries = [];
    for (let i = 0; i < items.length; i++) {
      const entry = items[i].webkitGetAsEntry();
      if (entry) entries.push(entry);
    }
    const collected = [];
    for (const entry of entries) {
      const filesWithPaths = await readEntryRecursively(entry, '');
      collected.push(...filesWithPaths);
    }
    if (collected.length) {
      await uploadFileEntries(collected, type);
      return;
    }
  }
  uploadFiles(e.dataTransfer.files, type);
}

function uploadFileWithProgress(url, file, relativePath, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', API + url);
    if (_token) xhr.setRequestHeader('Authorization', `Bearer ${_token}`);
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable && onProgress) onProgress(e.loaded, e.total);
    };
    xhr.onload = () => {
      if (xhr.status === 401) { doLogout(); reject(new Error('Unauthorised')); return; }
      if (xhr.status >= 200 && xhr.status < 300) resolve();
      else reject(new Error('Upload failed'));
    };
    xhr.onerror = () => reject(new Error('Network error'));
    const fd = new FormData();
    if (relativePath) fd.append('relative_path', relativePath);
    fd.append('file', file);
    xhr.send(fd);
  });
}

async function uploadFiles(fileList, type) {
  const entries = Array.from(fileList).map(file => ({
    file,
    relativePath: file.webkitRelativePath || file.name
  }));

}

async function uploadFileEntries(entries, type) {
  if (!entries.length) return;
  const prog = document.getElementById('upload-progress');
  const statusText = document.getElementById('upload-status-text');
  const statusPct = document.getElementById('upload-status-pct');
  const fillEl = document.getElementById('upload-progress-fill');
  if (prog) prog.style.display = 'flex';
  let ok = 0;
  for (let i = 0; i < entries.length; i++) {
    const { file, relativePath } = entries[i];
    const displayLabel = relativePath || file.name;
    if (statusText) statusText.textContent = `Uploading (${i + 1}/${entries.length}): ${displayLabel}`;
    if (statusPct) statusPct.textContent = '0%';
    if (fillEl) fillEl.style.width = '0%';
    try {
      const accId = _activeDrive?.id || 'default';
      const targetUrl = type === 'smb'
        ? `/api/smb/upload/${_activeDrive.id}?path=${encodeURIComponent(_path)}`
        : (type === 'onedrive'
            ? `/api/onedrive/upload?folder=${encodeURIComponent(_folderId)}&account_id=${encodeURIComponent(accId)}`
            : `/api/gdrive/upload?folder=${encodeURIComponent(_folderId)}&account_id=${encodeURIComponent(accId)}`);
      await uploadFileWithProgress(targetUrl, file, relativePath, (loaded, total) => {
        const pct = Math.min(100, Math.round((loaded / total) * 100));
        if (fillEl) fillEl.style.width = pct + '%';
        if (statusPct) statusPct.textContent = `${pct}% (${fmtSize(loaded)} / ${fmtSize(total)})`;
      });
      ok++;
    } catch(e) { toast(`Failed: ${displayLabel} – ${e.message}`, 'error'); }
  }
  closeModal();
  if (ok) toast(`Uploaded ${ok} file${ok>1?'s':''}`, 'success');
  reloadActiveDriveFiles();
}

async function refreshGDStatus() {

async function doAddShare() {
  const nameVal = document.getElementById('s-name').value.trim();
  const body = {
    name: nameVal,
    custom_name: nameVal,
    host: document.getElementById('s-host').value.trim(),
    share: document.getElementById('s-share').value.trim(),
    username: document.getElementById('s-user').value.trim(),
    password: document.getElementById('s-pass').value,
    port: parseInt(document.getElementById('s-port').value)||445,
  };
  if (!body.name||!body.host||!body.share) {
    toast('Display name, host and share are required', 'error'); return;
  }
  try {
    await apiJSON('/api/smb/shares', {method:'POST', json:body});
    closeModal();
    toast(`SMB share "${body.name}" added`, 'success');
    await refreshShares();
    renderSidebar();
    if (_view === 'settings') renderSettings();
  } catch(e) { toast('Failed: '+e.message, 'error'); }
}

async function deleteShare(id) {
  if (!requireAdminFrontend('remove SMB shares')) return;
  const s = _shares.find(item => item.id === id);
  if (!confirm(`Remove SMB share "${s ? s.name : id}"?`)) return;
  try {
    await apiJSON(`/api/smb/shares/${encodeURIComponent(id)}`, {method:'DELETE'});
    toast('Share removed', 'success');
    if (_activeDrive?.type === 'smb' && _activeDrive?.id === id) {
      _activeDrive = null;
      setView('welcome');
    }
    await refreshShares();
    renderSidebar();
    if (_view === 'settings') renderSettings();
  } catch(e) { toast('Failed: '+e.message, 'error'); }
}

async function saveSmbProxyCreds() {
  if (!requireAdminFrontend('update SMB Proxy credentials')) return;
  const user = document.getElementById('smb-proxy-user').value.trim();
  const pass = document.getElementById('smb-proxy-pass').value;
  const msg  = document.getElementById('smb-proxy-msg');
  if (!pass) { msg.style.color='var(--color-error)'; msg.textContent='Password is required'; return; }
  try {
    const r = await apiJSON('/api/smb/proxy-credentials', {method:'POST', json:{username:user, password:pass}});
    msg.style.color = 'var(--color-success)';
    msg.textContent = r.message || 'Saved!';
    document.getElementById('smb-proxy-pass').value = '';
    setTimeout(() => renderSettings(), 1200);
  } catch(e) {
    msg.style.color = 'var(--color-error)';
    msg.textContent = 'Failed: ' + e.message;
  }
}

  try {

    });
    toast(enabled ? 'SMB Proxy share enabled & mounted' : 'SMB Proxy share disabled', 'success');
    await renderSettings();
  } catch (e) {
    toast('Failed to update SMB Proxy: ' + e.message, 'error');
    await renderSettings();
  }
}

async function saveDriveSmbShareName(accountId, provider = '') {
  if (!requireAdminFrontend('rename SMB Proxy shares')) return;
  const prov = provider || 'gdrive';
  const inp = document.getElementById(`smb-share-name-${prov}-${accountId}`) || document.getElementById(`smb-share-name-${accountId}`);
  const rawName = (inp ? inp.value : '').trim();
  if (!rawName) {
    toast('SMB share name cannot be empty', 'error');
    return;
  }
  try {
    const res = await apiJSON(`/api/smb/proxy-shares/${encodeURIComponent(accountId)}`, {
      method: 'POST',
      json: { smb_share_name: rawName, provider: prov },
    });
    const finalName = res.share?.smb_share_name || rawName;
    toast(`SMB share name updated to "${finalName}"`, 'success');
    await renderSettings();
  } catch (e) {
    toast('Failed: ' + e.message, 'error');

async function connectGDrive(customName = '', accountId = '') {
  if (!requireAdminFrontend('connect Google Drive accounts')) return;
  try {
    const qs = new URLSearchParams();
    if (customName) qs.set('name', customName);
    if (accountId) qs.set('account_id', accountId);
    const data = await apiJSON(`/api/gdrive/auth?${qs.toString()}`);
    if (data.url && data.url.startsWith('/api/gdrive/callback')) {
      // Preview environment instant OAuth callback
      await fetch(data.url);
      await refreshGDStatus();
      renderSidebar();
      if (_view === 'settings') renderSettings();
      toast(`Google Drive "${customName || 'Account'}" connected`, 'success');
      return;
    }
    window.open(data.url, '_blank');
    toast('Complete Google sign-in in the new tab, then return here', 'success');
  } catch(e) { toast('Failed: '+e.message, 'error'); }
}

async function disconnectGDrive(accountId = '', accountName = 'Google Drive') {
  if (!requireAdminFrontend('disconnect Google Drive accounts')) return;
  if (!confirm(`Disconnect "${accountName}"?`)) return;
  try {
    if (accountId) {
      await apiJSON(`/api/gdrive/accounts/${encodeURIComponent(accountId)}`, {method:'DELETE'});
    } else {
      await apiJSON('/api/gdrive/revoke', {method:'DELETE'});
    }
    toast(`Disconnected "${accountName}"`, 'success');
    if (_activeDrive?.type === 'gdrive' && (!accountId || _activeDrive?.id === accountId)) {
      _activeDrive = null;
      setView('welcome');
    }
    await refreshGDStatus();
    renderSidebar();
    if (_view === 'settings') renderSettings();
  } catch(e) { toast('Failed: '+e.message, 'error'); }
}

  const customName = (document.getElementById('od-new-custom-name')?.value || '').trim();
  closeModal();
  connectOneDrive(customName, '');
}

async function connectOneDrive(customName = '', accountId = '') {
  if (!requireAdminFrontend('connect OneDrive accounts')) return;
  try {
    const qs = new URLSearchParams();
    if (customName) qs.set('name', customName);
    if (accountId) qs.set('account_id', accountId);
    const data = await apiJSON(`/api/onedrive/auth?${qs.toString()}`);
    if (data.url && data.url.startsWith('/api/onedrive/callback')) {
      await fetch(data.url);
      await refreshODStatus();
      renderSidebar();
      if (_view === 'settings') renderSettings();
      toast(`Microsoft OneDrive "${customName || 'Account'}" connected`, 'success');
      return;
    }
    window.open(data.url, '_blank');
    toast('Complete Microsoft sign-in in the new tab, then return here', 'success');
  } catch(e) { toast('Failed: '+e.message, 'error'); }
}

async function disconnectOneDrive(accountId = '', accountName = 'OneDrive') {
  if (!requireAdminFrontend('disconnect OneDrive accounts')) return;
  if (!confirm(`Disconnect "${accountName}"?`)) return;
  try {
    if (accountId) {
      await apiJSON(`/api/onedrive/accounts/${encodeURIComponent(accountId)}`, {method:'DELETE'});
    } else {
      await apiJSON('/api/onedrive/revoke', {method:'DELETE'});
    }
    toast(`Disconnected "${accountName}"`, 'success');
    if (_activeDrive?.type === 'onedrive' && (!accountId || _activeDrive?.id === accountId)) {
      _activeDrive = null;
      setView('welcome');
    }
    await refreshODStatus();
    renderSidebar();
    if (_view === 'settings') renderSettings();
  } catch(e) { toast('Failed: '+e.message, 'error'); }
}

function showLoading() {
  document.getElementById('content-area').innerHTML =
    `<div class="loading-state"><div class="spinner"></div></div>`;
}
function showError(msg) {
  document.getElementById('content-area').innerHTML =
    `<div class="empty-state"><svg data-lucide="alert-triangle" width="48" height="48"></svg>
     <h3>Error</h3><p>${escHtml(msg)}</p></div>`;
  lucide.createIcons();
}

function setBreadcrumb(crumbs) {
  BREADCRUMBS = crumbs;
  const el = document.getElementById('breadcrumb');
  el.innerHTML = crumbs.map((c,i) => {
    const isLast = i===crumbs.length-1;
    const sep = i>0 ? `<span class="bc-sep">/</span>` : '';
    const fn = isLast ? '' : `onclick="bcGo(${i})"`;
    return `${sep}<span class="bc-seg ${isLast?'current':''}" ${fn}>${escHtml(c.name)}</span>`;
  }).join('');
}

function bcGo(i) {
  const c = BREADCRUMBS[i];
  if (!c) return;
  if (_activeDrive?.type === 'smb') {
    _path = c.target;
    loadSMBFiles();
  } else if (_activeDrive?.type === 'onedrive') {
    _pathStack = _pathStack.slice(0, c.index + 1);
    _folderId = c.id || (c.name==='OneDrive'?'root':_pathStack[_pathStack.length-1].id);
    loadOneDriveFiles();
  } else if (_activeDrive?.type === 'gdrive') {
    _pathStack = _pathStack.slice(0, c.index + 1);
    _folderId = c.id || (c.name==='Google Drive'?'root':_pathStack[_pathStack.length-1].id);
    loadGDriveFiles();
  }
}

function setTopbarActions(html) {
  document.getElementById('topbar-actions').innerHTML = html;
  lucide.createIcons();
}
function showModal(html, extraStyle) {
  var st = extraStyle ? 'style="' + extraStyle + '"' : '';
  document.getElementById('modal-root').innerHTML =
    `<div class="modal-backdrop" id="modal-backdrop">
       <div class="modal" ${st}>${html}</div></div>`;
  document.getElementById('modal-backdrop').onclick = e => { if(e.target.id==='modal-backdrop') closeModal(); };
  lucide.createIcons();
}
function closeModal() {
  cleanupActiveMedia();
  document.getElementById('modal-root').innerHTML='';
}
function toast(msg, type='success') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const icon = type==='success' ? 'check-circle' : 'alert-circle';
  el.innerHTML = `<svg data-lucide="${icon}" class="toast-icon"></svg><span>${escHtml(msg)}</span>`;
  document.getElementById('toasts').appendChild(el);
  lucide.createIcons();
  setTimeout(() => el.remove(), 4000);
}
function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) { return escHtml(s); }

async function selectTheme(themeId, silent = false) {
  applyTheme(themeId, true);
  if (_user) _user.theme = _activeTheme;
  if (_view === 'settings' && _settingsTab === 'themes') {
    renderSettings();
  }
  const themeObj = DARK_THEMES.find(t => t.id === _activeTheme) || DARK_THEMES[0];
  try {
    if (_token) {
      await apiJSON('/api/auth/theme', { method: 'POST', json: { theme: _activeTheme } });
    }
    if (!silent) toast(`Theme set to ${themeObj.name}`, 'success');
  } catch (e) {
    if (!silent) toast('Failed to save theme: ' + e.message, 'error');
  }
}

function cycleTheme() {
  const idx = DARK_THEMES.findIndex(t => t.id === _activeTheme);
  const next = DARK_THEMES[(idx + 1) % DARK_THEMES.length];
  selectTheme(next.id, false);
}

function isCompactViewport() {
  return window.innerWidth <= 900;
}

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const bd = document.getElementById('sidebar-backdrop');
  if (!sb) return;
  if (isCompactViewport()) {
    const willOpen = !sb.classList.contains('open');
    sb.classList.toggle('open', willOpen);
    if (bd) bd.classList.toggle('visible', willOpen);
  } else {
    const willCollapse = !sb.classList.contains('collapsed');
    sb.classList.toggle('collapsed', willCollapse);
    try { localStorage.setItem('sd_sidebar_collapsed', willCollapse ? '1' : '0'); } catch (_) {}
  }
}

function closeMobileSidebar() {
  const sb = document.getElementById('sidebar');
  const bd = document.getElementById('sidebar-backdrop');
  if (sb) sb.classList.remove('open');
  if (bd) bd.classList.remove('visible');
}

function checkMobile() {
  const sb = document.getElementById('sidebar');
  const bd = document.getElementById('sidebar-backdrop');
  if (!sb) return;
  if (isCompactViewport()) {
    if (!sb.classList.contains('open') && bd) bd.classList.remove('visible');
  } else {
    sb.classList.remove('open');
    if (bd) bd.classList.remove('visible');
    try {
      const saved = localStorage.getItem('sd_sidebar_collapsed') === '1';
      sb.classList.toggle('collapsed', saved);
    } catch (_) {}
  }
}
window.addEventListener('resize', checkMobile);

if (location.hash === '#gdrive-connected' || location.hash === '#onedrive-connected') {
  history.replaceState(null,'',location.pathname);
}

(async () => {
  checkMobile();
  if (_token) {
    try { await initApp(); }
    catch(_) {
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('app').style.display = 'none';
    }
  }
})();
</script>
</body>
</html>
